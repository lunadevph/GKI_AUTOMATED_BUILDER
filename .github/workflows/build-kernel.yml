name: Build Kernel 5.15 KernelSU-Next + SuSFS

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source Repository (owner/repository)'
        required: true
        default: 'torvalds/linux'

      KERNEL_BRANCH:
        description: 'Kernel Source Branch'
        required: true
        default: 'master'

      DEFCONFIG_NAME:
        description: 'Defconfig File Name'
        required: true
        default: 'gki_defconfig'

      KERNEL_NAME:
        description: 'Kernel Name Suffix'
        required: true
        default: 'PureKernel-LunaDevPH'

      ENABLE_SUSFS:
        description: 'Enable SuSFS'
        required: true
        type: boolean
        default: true

      ENABLE_BBG:
        description: 'Enable Baseband Guard (BBG)'
        required: true
        type: boolean
        default: false

      ENABLE_WILD_PATCHES:
        description: 'Enable compatible WildKernels patches'
        required: true
        type: boolean
        default: false

      ENABLE_BBR:
        description: 'Enable BBR congestion control'
        required: true
        type: boolean
        default: true

      ENABLE_WIREGUARD:
        description: 'Enable WireGuard'
        required: true
        type: boolean
        default: false

      ENABLE_IPSET:
        description: 'Enable IPSet'
        required: true
        type: boolean
        default: false

      ENABLE_CAFe:
        description: 'Enable CAKE/fq_codel networking'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # BUILD SPACE
      # ============================================================

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      # ============================================================
      # KERNEL SOURCE
      # ============================================================

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.KERNEL_SOURCE }}
          ref: ${{ inputs.KERNEL_BRANCH }}
          path: kernel_workspace
          fetch-depth: 1

      - name: Verify Kernel Source
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "=========================================="
          echo "KERNEL SOURCE"
          echo "=========================================="

          echo "Repository:"
          git remote get-url origin

          echo "Commit:"
          git rev-parse --short HEAD

          echo

          test -f Makefile || {
            echo "ERROR: Kernel Makefile not found."
            exit 1
          }

          test -d arch/arm64 || {
            echo "ERROR: arch/arm64 not found."
            exit 1
          }

          test -d drivers || {
            echo "ERROR: drivers/ not found."
            exit 1
          }

          echo "Kernel source OK."

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            build-essential \
            zip \
            curl \
            git \
            wget \
            clang \
            llvm \
            lld \
            ccache \
            patch \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ inputs.KERNEL_SOURCE }}-${{ inputs.KERNEL_BRANCH }}-${{ hashFiles('kernel_workspace/Makefile', 'kernel_workspace/arch/arm64/configs/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.KERNEL_SOURCE }}-${{ inputs.KERNEL_BRANCH }}-
            ccache-${{ runner.os }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cache/ccache"

          ccache --set-config=cache_dir="$HOME/.cache/ccache"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

          ccache --zero-stats

          echo "ccache configured:"
          ccache --show-config

      # ============================================================
      # KERNELSU-NEXT
      # ============================================================

      - name: Install KernelSU-Next
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "=========================================="
          echo "KERNELSU-NEXT"
          echo "=========================================="

          SETUP_URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"

          curl -fL \
            "$SETUP_URL" \
            -o /tmp/ksu-next-setup.sh

          test -s /tmp/ksu-next-setup.sh || {
            echo "ERROR: KernelSU-Next setup script is empty."
            exit 1
          }

          chmod +x /tmp/ksu-next-setup.sh

          /tmp/ksu-next-setup.sh next

          echo "KernelSU-Next installed."

      # ============================================================
      # SUSFS
      # ============================================================

      - name: Clone SuSFS
        if: ${{ inputs.ENABLE_SUSFS }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "=========================================="
          echo "SUSFS"
          echo "=========================================="

          git clone \
            --depth=1 \
            --single-branch \
            --branch 1.4.2-gki-android13-5.15 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          echo
          echo "SuSFS commit:"
          git -C susfs rev-parse HEAD

          echo
          echo "Available kernel patches:"
          find susfs/kernel_patches \
            -type f \
            -name '*.patch' \
            | sort

      - name: Apply SuSFS
        if: ${{ inputs.ENABLE_SUSFS }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "=========================================="
          echo "APPLYING SUSFS"
          echo "=========================================="

          SUSFS_KERNEL_PATCH="susfs/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

          test -f "$SUSFS_KERNEL_PATCH" || {
            echo "ERROR: Expected SuSFS patch not found:"
            echo "$SUSFS_KERNEL_PATCH"

            echo
            echo "Available patches:"
            find susfs/kernel_patches \
              -type f \
              -name '*.patch' \
              | sort

            exit 1
          }

          # Required SuSFS source files.
          cp \
            susfs/kernel_patches/fs/susfs.c \
            fs/susfs.c

          cp \
            susfs/kernel_patches/include/linux/susfs.h \
            include/linux/susfs.h

          # These are required by the current GKI 5.15 patch.
          if [ -f susfs/kernel_patches/fs/sus_su.c ]; then
            cp \
              susfs/kernel_patches/fs/sus_su.c \
              fs/sus_su.c
          fi

          if [ -f susfs/kernel_patches/include/linux/sus_su.h ]; then
            cp \
              susfs/kernel_patches/include/linux/sus_su.h \
              include/linux/sus_su.h
          fi

          if [ -f susfs/kernel_patches/include/linux/susfs_def.h ]; then
            cp \
              susfs/kernel_patches/include/linux/susfs_def.h \
              include/linux/susfs_def.h
          fi

          echo "Applying:"
          echo "$SUSFS_KERNEL_PATCH"

          patch -p1 < "$SUSFS_KERNEL_PATCH"

          echo "SuSFS kernel patch applied."

      - name: Apply SuSFS KernelSU Patch
        if: ${{ inputs.ENABLE_SUSFS }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          test -d drivers/kernelsu || {
            echo "ERROR: drivers/kernelsu not found."
            exit 1
          }

          test -f \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || {
              echo "ERROR: KernelSU SuSFS patch not found."
              exit 1
            }

          cd drivers/kernelsu

          patch -p1 \
            < ../../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          echo "KernelSU SuSFS patch applied."

      # ============================================================
      # BBG
      # ============================================================

      - name: Install Baseband Guard
        if: ${{ inputs.ENABLE_BBG }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "=========================================="
          echo "BASEBAND GUARD"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/vc-teahouse/Baseband-guard.git \
            baseband-guard

          echo "BBG source downloaded."

          echo
          echo "BBG files:"
          find baseband-guard \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100

      - name: Integrate Baseband Guard
        if: ${{ inputs.ENABLE_BBG }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "Searching for BBG kernel patch..."

          BBG_PATCH="$(
            find baseband-guard \
              -type f \
              \( \
                -name '*.patch' \
                -o \
                -name '*.diff' \
              \) \
              | head -n 1
          )"

          if [ -z "$BBG_PATCH" ]; then
            echo "ERROR: No BBG patch was found."
            echo "The BBG repository layout may have changed."
            echo
            echo "Files:"
            find baseband-guard \
              -type f \
              | sort \
              | head -200
            exit 1
          fi

          echo "Using BBG patch:"
          echo "$BBG_PATCH"

          patch -p1 < "$BBG_PATCH"

      # ============================================================
      # WILDKERNELS PATCHES
      # ============================================================

      - name: Clone WildKernels Kernel Patches
        if: ${{ inputs.ENABLE_WILD_PATCHES }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "=========================================="
          echo "WILDKERNELS PATCHES"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/WildKernels/kernel_patches.git \
            wildkernel_patches

          echo "WildKernels patches downloaded."

          echo
          echo "Available patches:"
          find wildkernel_patches \
            -type f \
            -name '*.patch' \
            | sort

      - name: Apply WildKernels Compatibility Patches
        if: ${{ inputs.ENABLE_WILD_PATCHES }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "=========================================="
          echo "WILDKERNELS COMPATIBILITY PATCHES"
          echo "=========================================="

          KERNEL_VERSION="$(
            make -s \
              O=out \
              ARCH=arm64 \
              kernelversion 2>/dev/null \
              || true
          )"

          echo "Kernel version: $KERNEL_VERSION"

          # WildKernels has a GKI ptrace patch specifically intended
          # for older kernels. Apply it only to 5.15.
          if [[ "$KERNEL_VERSION" == 5.15* ]]; then

            if [ -f wildkernel_patches/gki_ptrace.patch ]; then
              echo "Applying GKI ptrace compatibility patch..."

              patch -p1 \
                < wildkernel_patches/gki_ptrace.patch
            else
              echo "gki_ptrace.patch not present; skipping."
            fi

          fi

          # Manual-hook patch from WildKernels.
          #
          # Only apply it when the KernelSU tree exposes the
          # non-kprobe hook configuration.
          if [ -f wildkernel_patches/next/scope_min_manual_hooks_v1.4.patch ]; then

            if grep -Rqs \
              "CONFIG_KSU_KPROBES_HOOK" \
              drivers/kernelsu \
              2>/dev/null; then

              echo "Applying WildKernels manual-hook patch..."

              patch -p1 \
                < wildkernel_patches/next/scope_min_manual_hooks_v1.4.patch

            else
              echo "KernelSU kprobe configuration not detected."
              echo "Skipping manual-hook patch."
            fi

          fi

      # ============================================================
      # DEFCONFIG
      # ============================================================

      - name: Configure Kernel
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          DEFCONFIG_PATH="$(
            find arch/arm64/configs \
              -type f \
              -name "${{ inputs.DEFCONFIG_NAME }}" \
              | head -n 1
          )"

          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "ERROR: Defconfig not found:"
            echo "${{ inputs.DEFCONFIG_NAME }}"
            exit 1
          fi

          echo "Using:"
          echo "$DEFCONFIG_PATH"

          cat >> "$DEFCONFIG_PATH" <<EOF

          # ==========================================================
          # KernelSU-Next
          # ==========================================================

          CONFIG_KSU=y

          # ==========================================================
          # SuSFS
          # ==========================================================

          CONFIG_KSU_SUSFS=${{ inputs.ENABLE_SUSFS && 'y' || 'n' }}

          # ==========================================================
          # SuSFS Features
          # ==========================================================

          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUD=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME-RELEASE=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y

          # ==========================================================
          # Kernel Name
          # ==========================================================

          CONFIG_LOCALVERSION="-${{ inputs.KERNEL_NAME }}"

          # ==========================================================
          # BBR
          # ==========================================================

          CONFIG_TCP_CONG_BBR=${{ inputs.ENABLE_BBR && 'y' || 'n' }}

          # ==========================================================
          # WireGuard
          # ==========================================================

          CONFIG_WIREGUARD=${{ inputs.ENABLE_WIREGUARD && 'y' || 'n' }}

          # ==========================================================
          # IPSet
          # ==========================================================

          CONFIG_IP_SET=${{ inputs.ENABLE_IPSET && 'y' || 'n' }}
          CONFIG_IP_SET_MAX=256

          # ==========================================================
          # CAKE / fq_codel
          # ==========================================================

          CONFIG_NET_SCH_FQ_CODEL=${{ inputs.ENABLE_CAFe && 'y' || 'n' }}
          CONFIG_NET_SCH_CAKE=${{ inputs.ENABLE_CAFe && 'y' || 'n' }}

          # ==========================================================
          # BBG
          # ==========================================================

          CONFIG_BBG=${{ inputs.ENABLE_BBG && 'y' || 'n' }}
          EOF

      # ============================================================
      # CONFIGURE
      # ============================================================

      - name: Prepare Kernel Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          make \
            O=out \
            ARCH=arm64 \
            "${{ inputs.DEFCONFIG_NAME }}"

          echo
          echo "Important configuration:"
          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_BBG=|CONFIG_TCP_CONG_BBR=|CONFIG_WIREGUARD=|CONFIG_IP_SET=|CONFIG_NET_SCH_(CAKE|FQ_CODEL)=' \
            out/.config \
            || true

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          export PATH="/usr/lib/ccache:$PATH"

          echo "=========================================="
          echo "BUILDING KERNEL"
          echo "=========================================="

          echo "Kernel:"
          make -s \
            O=out \
            ARCH=arm64 \
            kernelversion

          echo
          echo "Compiler:"
          clang --version | head -n 1

          echo
          echo "Building..."

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      # ============================================================
      # CCACHE STATS
      # ============================================================

      - name: ccache Statistics
        if: always()
        shell: bash
        run: |
          ccache --show-stats || true

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify Kernel
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          test -f out/arch/arm64/boot/Image || {
            echo "ERROR: Kernel Image was not generated."
            exit 1
          }

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo "Image:"
          ls -lh out/arch/arm64/boot/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz:"
            ls -lh out/arch/arm64/boot/Image.gz
          fi

          echo
          echo "Kernel version:"
          make -s \
            O=out \
            ARCH=arm64 \
            kernelversion

          echo
          echo "Local version:"
          grep '^CONFIG_LOCALVERSION=' out/.config || true

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Pack Kernel
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          rm -rf output
          mkdir -p output

          cp \
            out/arch/arm64/boot/Image \
            output/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp \
              out/arch/arm64/boot/Image.gz \
              output/Image.gz
          fi

          cd output

          zip -9 \
            "kernel-${{ inputs.KERNEL_NAME }}.zip" \
            ./*

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.KERNEL_NAME }}
          path: kernel_workspace/output/kernel-${{ inputs.KERNEL_NAME }}.zip
          if-no-files-found: error
