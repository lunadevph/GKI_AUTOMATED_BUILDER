name: Build Kernel 5.15 KernelSU-Next + SuSFS

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source Repository (owner/repository)'
        required: true
        default: 'torvalds/linux'

      KERNEL_BRANCH:
        description: 'Kernel Source Branch'
        required: true
        default: 'master'

      DEFCONFIG_NAME:
        description: 'Defconfig File Name (e.g. gki_defconfig or vendor_defconfig)'
        required: true
        default: 'gki_defconfig'

      KERNEL_NAME:
        description: 'Kernel Name Suffix (e.g. PureKernel-LunaDevPH)'
        required: true
        default: 'PureKernel-LunaDevPH'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # BUILD SPACE
      # ============================================================

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      # ============================================================
      # KERNEL SOURCE
      # ============================================================

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.KERNEL_SOURCE }}
          ref: ${{ inputs.KERNEL_BRANCH }}
          path: kernel_workspace
          fetch-depth: 1

      - name: Verify Kernel Source
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "=========================================="
          echo "Kernel Source"
          echo "=========================================="

          echo "Repository:"
          git remote get-url origin

          echo "Branch:"
          git branch --show-current

          echo
          echo "Checking kernel tree..."

          test -f Makefile || {
            echo "ERROR: Makefile not found."
            exit 1
          }

          test -d arch/arm64 || {
            echo "ERROR: arch/arm64 not found."
            exit 1
          }

          test -d drivers || {
            echo "ERROR: drivers directory not found."
            exit 1
          }

          echo "Kernel source OK."

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            build-essential \
            zip \
            curl \
            git \
            wget \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ============================================================
      # KERNELSU-NEXT
      # ============================================================

      - name: Install KernelSU-Next
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "=========================================="
          echo "KernelSU-Next"
          echo "=========================================="

          SETUP_URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"

          echo "Downloading:"
          echo "$SETUP_URL"

          curl -fL \
            "$SETUP_URL" \
            -o /tmp/ksu-next-setup.sh

          test -s /tmp/ksu-next-setup.sh || {
            echo "ERROR: KernelSU-Next setup script is empty."
            exit 1
          }

          chmod +x /tmp/ksu-next-setup.sh

          /tmp/ksu-next-setup.sh next

          echo "KernelSU-Next installed."

      # ============================================================
      # SUSFS
      # ============================================================

      - name: Clone SuSFS
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "=========================================="
          echo "SuSFS"
          echo "=========================================="

          git clone \
            --depth=1 \
            --single-branch \
            --branch 1.4.2-gki-android13-5.15 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          test -d susfs || {
            echo "ERROR: SuSFS clone failed."
            exit 1
          }

          echo "SuSFS cloned successfully."

      - name: Verify SuSFS
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "Checking SuSFS files..."

          test -f susfs/kernel_patches/fs/susfs.c || {
            echo "ERROR: susfs.c not found."
            exit 1
          }

          test -f susfs/kernel_patches/include/linux/susfs.h || {
            echo "ERROR: susfs.h not found."
            exit 1
          }

          test -f susfs/kernel_patches/5.15/5.15_ksu_susfs.patch || {
            echo "ERROR: 5.15_ksu_susfs.patch not found."
            exit 1
          }

          test -f susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || {
            echo "ERROR: KernelSU SuSFS patch not found."
            exit 1
          }

          echo "All required SuSFS files found."

      # ============================================================
      # APPLY SUSFS KERNEL PATCH
      # ============================================================

      - name: Apply SuSFS Kernel Patch
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "Copying SuSFS source..."

          cp \
            susfs/kernel_patches/fs/susfs.c \
            fs/susfs.c

          cp \
            susfs/kernel_patches/include/linux/susfs.h \
            include/linux/susfs.h

          echo "Applying Linux 5.15 SuSFS patch..."

          patch -p1 \
            < susfs/kernel_patches/5.15/5.15_ksu_susfs.patch

      # ============================================================
      # APPLY SUSFS KERNELSU PATCH
      # ============================================================

      - name: Apply SuSFS KernelSU-Next Patch
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: drivers/kernelsu was not found."
            echo "KernelSU-Next installation failed."
            exit 1
          fi

          cd drivers/kernelsu

          echo "Applying KernelSU SuSFS patch..."

          patch -p1 \
            < ../../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          echo "KernelSU SuSFS patch applied."

      # ============================================================
      # DEFCONFIG
      # ============================================================

      - name: Configure Defconfig
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          DEFCONFIG_PATH="$(
            find arch/arm64/configs \
              -type f \
              -name "${{ inputs.DEFCONFIG_NAME }}" \
              | head -n 1
          )"

          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "ERROR: Defconfig '${{ inputs.DEFCONFIG_NAME }}' not found."
            exit 1
          fi

          echo "Using:"
          echo "$DEFCONFIG_PATH"

          echo
          echo "Kernel name:"
          echo "${{ inputs.KERNEL_NAME }}"

          cat >> "$DEFCONFIG_PATH" <<EOF

          # ==========================================================
          # KernelSU-Next
          # ==========================================================

          CONFIG_KSU=y

          # ==========================================================
          # SuSFS
          # ==========================================================

          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUD=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME-RELEASE=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y

          # ==========================================================
          # Custom Kernel Name
          # ==========================================================

          CONFIG_LOCALVERSION="-${{ inputs.KERNEL_NAME }}"
          EOF

      # ============================================================
      # PREPARE CONFIG
      # ============================================================

      - name: Prepare Kernel Configuration
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          make \
            O=out \
            ARCH=arm64 \
            "${{ inputs.DEFCONFIG_NAME }}"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "=========================================="
          echo "Building Kernel"
          echo "=========================================="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      # ============================================================
      # VERIFY OUTPUT
      # ============================================================

      - name: Verify Kernel Image
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "=========================================="
          echo "Kernel Output"
          echo "=========================================="

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Image was not generated."
            exit 1
          fi

          echo "Image: OK"

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz: OK"
          fi

          echo
          echo "Kernel version:"

          make -s \
            O=out \
            ARCH=arm64 \
            kernelversion

          echo
          echo "CONFIG_LOCALVERSION:"

          grep '^CONFIG_LOCALVERSION=' \
            out/.config || true

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Pack Kernel
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_workspace"

          rm -rf output
          mkdir -p output

          cp \
            out/arch/arm64/boot/Image \
            output/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp \
              out/arch/arm64/boot/Image.gz \
              output/Image.gz
          fi

          cd output

          zip -9 \
            "kernel-${{ inputs.KERNEL_NAME }}.zip" \
            ./*

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.KERNEL_NAME }}
          path: kernel_workspace/output/kernel-${{ inputs.KERNEL_NAME }}.zip
          if-no-files-found: error
