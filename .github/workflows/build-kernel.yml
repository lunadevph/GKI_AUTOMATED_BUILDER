name: Build Android 13 GKI 5.15

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:

      KERNEL_BRANCH:
        description: "Google GKI manifest branch"
        required: true
        default: "common-android13-5.15"

      DEFCONFIG_NAME:
        description: "GKI defconfig"
        required: true
        default: "gki_defconfig"

      KERNEL_NAME:
        description: "Kernel LOCALVERSION name"
        required: true
        default: "LunaGKI"

      FEATURE_SET:
        description: "Kernel feature set"
        required: true
        type: choice
        default: "KSU,SUSFS"
        options:
          - "NONE"
          - "KSU"
          - "SUSFS"
          - "KSU,SUSFS"
          - "KSU,BBG"
          - "KSU,DROIDSPACES"
          - "KSU,NET"
          - "KSU,SUSFS,BBG"
          - "KSU,SUSFS,DROIDSPACES"
          - "KSU,SUSFS,NET"
          - "KSU,SUSFS,BBG,DROIDSPACES"
          - "KSU,SUSFS,BBG,NET"
          - "KSU,SUSFS,DROIDSPACES,NET"
          - "KSU,BBG,DROIDSPACES,NET"
          - "FULL"

      KSU_BRANCH:
        description: "KernelSU-Next branch"
        required: false
        default: "dev-susfs"

      SUSFS_BRANCH:
        description: "SUSFS branch/tag"
        required: false
        default: "gki-android13-5.15"

      ENABLE_KSU:
        description: "Enable KernelSU-Next"
        required: true
        type: boolean
        default: true

      ENABLE_SUSFS:
        description: "Enable SUSFS"
        required: true
        type: boolean
        default: true

      ENABLE_BBG:
        description: "Enable Baseband Guard"
        required: true
        type: boolean
        default: false

      ENABLE_DROIDSPACES:
        description: "Enable DroidSpaces patches"
        required: true
        type: boolean
        default: false

      ENABLE_NETWORKING:
        description: "Enable networking additions"
        required: true
        type: boolean
        default: false

      ENABLE_CCACHE:
        description: "Enable ccache"
        required: true
        type: boolean
        default: true

      BUILD_JOBS:
        description: "Build jobs (0 = automatic)"
        required: true
        default: "0"


jobs:

  build:

    name: "${{ inputs.KERNEL_NAME }} - GKI 5.15"

    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # ==========================================================
      # DISK
      # ==========================================================

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      # ==========================================================
      # REPO
      # ==========================================================

      - name: Install Google Repo
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            build-essential \
            zip \
            unzip \
            curl \
            wget \
            git \
            ccache \
            python3 \
            python3-pip \
            rsync \
            dwarves \
            lz4 \
            zstd \
            xz-utils \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf

      # ==========================================================
      # SWAP
      # ==========================================================

      - name: Setup Swap
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-size-gb: 16

      # ==========================================================
      # CCACHE CACHE
      # ==========================================================

      - name: Restore ccache
        if: inputs.ENABLE_CCACHE
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gki-android13-5.15-ccache-${{ github.ref_name }}
          restore-keys: |
            gki-android13-5.15-ccache-

      - name: Configure ccache
        if: inputs.ENABLE_CCACHE
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ccache"

          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=10G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6

          ccache -z

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          ccache -p

      # ==========================================================
      # GOOGLE GKI REPO SYNC
      # ==========================================================

      - name: Initialize Google GKI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/gki"

          cd "$GITHUB_WORKSPACE/gki"

          echo "=========================================="
          echo "Google Android GKI"
          echo "=========================================="

          echo "Manifest:"
          echo "${{ inputs.KERNEL_BRANCH }}"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${{ inputs.KERNEL_BRANCH }}" \
            --depth=1

      - name: Sync Google GKI
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Synchronizing Google GKI"
          echo "=========================================="

          repo sync \
            -c \
            -j"$(nproc)" \
            --no-tags \
            --optimized-fetch

          echo
          echo "=========================================="
          echo "Repo Projects"
          echo "=========================================="

          repo list

      # ==========================================================
      # VERIFY
      # ==========================================================

      - name: Verify GKI Source
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking GKI"
          echo "=========================================="

          if [ ! -d common ]; then
            echo "ERROR: common/ was not found."
            exit 1
          fi

          if [ ! -d common/arch/arm64 ]; then
            echo "ERROR: common/arch/arm64 was not found."
            exit 1
          fi

          if [ ! -d common/arch/arm64/configs ]; then
            echo "ERROR: GKI configs were not found."
            exit 1
          fi

          if [ ! -f \
            "common/arch/arm64/configs/${{ inputs.DEFCONFIG_NAME }}" ]; then

            echo "ERROR: Defconfig not found:"
            echo "common/arch/arm64/configs/${{ inputs.DEFCONFIG_NAME }}"

            echo
            echo "Available configs:"

            find \
              common/arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              | sort \
              | head -100

            exit 1
          fi

          echo "GKI source verified."

          echo "GKI_ROOT=$GITHUB_WORKSPACE/gki" >> "$GITHUB_ENV"
          echo "KERNEL_ROOT=$GITHUB_WORKSPACE/gki/common" >> "$GITHUB_ENV"

      # ==========================================================
      # KERNELSU-NEXT
      # ==========================================================

      - name: Setup KernelSU-Next
        if: inputs.ENABLE_KSU || contains(inputs.FEATURE_SET, 'KSU') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "KernelSU-Next"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next

          echo "KernelSU-Next installed."

          if [ -d drivers/kernelsu ]; then
            echo "KernelSU directory:"
            ls -la drivers/kernelsu
          else
            echo "WARNING: drivers/kernelsu was not created."
          fi

      # ==========================================================
      # SUSFS
      # ==========================================================

      - name: Setup SUSFS
        if: inputs.ENABLE_SUSFS || contains(inputs.FEATURE_SET, 'SUSFS') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SUSFS"
          echo "=========================================="

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch "${{ inputs.SUSFS_BRANCH }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          echo "SUSFS cloned successfully."

          echo
          echo "Searching for 5.15 SUSFS patch..."

          SUSFS_PATCH=""

          for candidate in \
            "susfs/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" \
            "susfs/kernel_patches/50_add_susfs_in_kernel-5.15.patch" \
            "susfs/kernel_patches/50_add_susfs_in_kernel-5.15-gki.patch"
          do
            if [ -f "$candidate" ]; then
              SUSFS_PATCH="$candidate"
              break
            fi
          done

          if [ -z "$SUSFS_PATCH" ]; then
            SUSFS_PATCH="$(
              find susfs/kernel_patches \
                -type f \
                -iname '*susfs*5.15*.patch' \
                | head -n 1
            )"
          fi

          if [ -z "$SUSFS_PATCH" ]; then
            echo "ERROR: No SUSFS 5.15 patch found."

            echo
            echo "Available patches:"

            find \
              susfs/kernel_patches \
              -type f \
              -name '*.patch' \
              | sort

            exit 1
          fi

          echo "Using:"
          echo "$SUSFS_PATCH"

          # ------------------------------------------------------
          # Copy SUSFS source
          # ------------------------------------------------------

          if [ -f susfs/kernel_patches/fs/susfs.c ]; then
            cp \
              susfs/kernel_patches/fs/susfs.c \
              common/fs/
          fi

          if [ -f susfs/kernel_patches/include/linux/susfs.h ]; then
            cp \
              susfs/kernel_patches/include/linux/susfs.h \
              common/include/linux/
          fi

          # ------------------------------------------------------
          # Apply kernel patch
          # ------------------------------------------------------

          cd common

          patch \
            -p1 \
            < "../$SUSFS_PATCH"

          cd ..

          # ------------------------------------------------------
          # KernelSU SUSFS patch
          # ------------------------------------------------------

          KSU_SUSFS_PATCH="susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ -f "$KSU_SUSFS_PATCH" ]; then

            if [ -d common/drivers/kernelsu ]; then

              cd common

              patch \
                -p1 \
                < "../$KSU_SUSFS_PATCH" \
                || echo "KernelSU SUSFS patch already applied or incompatible."

              cd ..

            else

              echo "WARNING: drivers/kernelsu not found."

            fi

          else

            echo "WARNING: KernelSU SUSFS integration patch not found."

          fi

          echo "SUSFS integration finished."

      # ==========================================================
      # BBG
      # ==========================================================

      - name: Setup Baseband Guard
        if: inputs.ENABLE_BBG || contains(inputs.FEATURE_SET, 'BBG') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Baseband Guard"
          echo "=========================================="

          rm -rf baseband-guard

          git clone \
            --depth=1 \
            https://github.com/WildKernels/baseband-guard.git \
            baseband-guard

          cd baseband-guard

          if [ -f setup.sh ]; then
            chmod +x setup.sh
            ./setup.sh
          else
            echo "ERROR: setup.sh not found."
            exit 1
          fi

          cd ..

          echo "BBG setup completed."

      # ==========================================================
      # DROIDSPACES
      # ==========================================================

      - name: Setup DroidSpaces
        if: inputs.ENABLE_DROIDSPACES || contains(inputs.FEATURE_SET, 'DROIDSPACES') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DroidSpaces"
          echo "=========================================="

          rm -rf Droidspaces-OSS

          git clone \
            --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            Droidspaces-OSS

          echo "DroidSpaces cloned."

          if [ -f Droidspaces-OSS/setup.sh ]; then
            chmod +x Droidspaces-OSS/setup.sh
            Droidspaces-OSS/setup.sh || true
          fi

      # ==========================================================
      # NETWORKING
      # ==========================================================

      - name: Configure Networking
        if: inputs.ENABLE_NETWORKING || contains(inputs.FEATURE_SET, 'NET') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Networking"
          echo "=========================================="

          cat > networking.fragment <<'EOF'
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_IPV6=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          EOF

          echo "Networking fragment created."

      # ==========================================================
      # CONFIG
      # ==========================================================

      - name: Configure GKI
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/out"

          rm -rf "$OUT"

          mkdir -p "$OUT"

          echo "=========================================="
          echo "GKI DEFCONFIG"
          echo "=========================================="

          make \
            O="$OUT" \
            ARCH=arm64 \
            "${{ inputs.DEFCONFIG_NAME }}"

          # ------------------------------------------------------
          # Kernel name
          # ------------------------------------------------------

          scripts/config \
            --file "$OUT/.config" \
            --set-str CONFIG_LOCALVERSION \
            "-${{ inputs.KERNEL_NAME }}"

          # ------------------------------------------------------
          # KSU
          # ------------------------------------------------------

          if [ "${{ inputs.ENABLE_KSU }}" = "true" ] || \
             [[ "${{ inputs.FEATURE_SET }}" == *"KSU"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            echo "Enabling KernelSU."

            scripts/config \
              --file "$OUT/.config" \
              --enable CONFIG_KSU

          fi

          # ------------------------------------------------------
          # SUSFS
          # ------------------------------------------------------

          if [ "${{ inputs.ENABLE_SUSFS }}" = "true" ] || \
             [[ "${{ inputs.FEATURE_SET }}" == *"SUSFS"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            echo "Enabling SUSFS."

            for CONFIG in \
              CONFIG_KSU_SUSFS \
              CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
              CONFIG_KSU_SUSFS_SUS_PATH \
              CONFIG_KSU_SUSFS_SUS_MOUNT \
              CONFIG_KSU_SUSFS_SUS_KSTAT \
              CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUD \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              CONFIG_KSU_SUSFS_TRY_UMOUNT \
              CONFIG_KSU_SUSFS_SPOOF_UNAME_RELEASE \
              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            do

              CONFIG_NAME="${CONFIG#CONFIG_}"

              if grep -Rqs \
                "config ${CONFIG_NAME}" \
                . \
                --include='Kconfig' \
                --include='Kconfig.*' \
                2>/dev/null; then

                scripts/config \
                  --file "$OUT/.config" \
                  --enable "$CONFIG"

                echo "Enabled: $CONFIG"

              else

                echo "Unavailable: $CONFIG"

              fi

            done

          else

            echo "SUSFS disabled."

          fi

          # ------------------------------------------------------
          # Networking
          # ------------------------------------------------------

          if [ -f networking.fragment ]; then

            while IFS='=' read -r KEY VALUE; do

              case "$VALUE" in

                y)
                  scripts/config \
                    --file "$OUT/.config" \
                    --enable "$KEY"
                  ;;

                m)
                  scripts/config \
                    --file "$OUT/.config" \
                    --module "$KEY"
                  ;;

              esac

            done < networking.fragment

          fi

          # ------------------------------------------------------
          # Final configuration
          # ------------------------------------------------------

          make \
            O="$OUT" \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep \
            -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_SUSFS' \
            "$OUT/.config" \
            || true

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build GKI Kernel
        working-directory: gki/common
        shell: bash
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          set -euo pipefail

          if [ "${{ inputs.BUILD_JOBS }}" = "0" ]; then
            JOBS="$(nproc)"
          else
            JOBS="${{ inputs.BUILD_JOBS }}"
          fi

          echo "Build jobs: $JOBS"

          # ------------------------------------------------------
          # Google GKI clang
          # ------------------------------------------------------

          if [ -d "$GITHUB_WORKSPACE/gki/prebuilts/clang/host/linux-x86" ]; then

            CLANG_DIR="$(
              find \
                "$GITHUB_WORKSPACE/gki/prebuilts/clang/host/linux-x86" \
                -maxdepth 2 \
                -type d \
                | sort \
                | tail -n 1
            )"

            if [ -x "$CLANG_DIR/bin/clang" ]; then
              export PATH="$CLANG_DIR/bin:$PATH"
              echo "Using Google Clang:"
              clang --version
            fi

          fi

          # ------------------------------------------------------
          # ccache
          # ------------------------------------------------------

          if [ "${{ inputs.ENABLE_CCACHE }}" = "true" ]; then

            export PATH="/usr/lib/ccache:$PATH"

            export CC="ccache clang"

            echo "ccache enabled."

          else

            export CC="clang"

            echo "ccache disabled."

          fi

          # ------------------------------------------------------
          # Build
          # ------------------------------------------------------

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CC" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$JOBS" \
            Image \
            Image.gz \
            dtbs

      # ==========================================================
      # CCACHE STATS
      # ==========================================================

      - name: ccache Statistics
        if: always()
        shell: bash
        run: |
          ccache -s || true

      # ==========================================================
      # KERNEL VERSION
      # ==========================================================

      - name: Kernel Information
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD INFORMATION"
          echo "=========================================="

          echo "Kernel name:"
          grep \
            '^CONFIG_LOCALVERSION=' \
            out/.config \
            || true

          echo
          echo "Feature set:"
          echo "${{ inputs.FEATURE_SET }}"

          echo
          echo "Google manifest:"
          echo "${{ inputs.KERNEL_BRANCH }}"

          if [ -f out/arch/arm64/boot/Image ]; then

            echo
            echo "Linux version:"

            strings \
              out/arch/arm64/boot/Image \
              | grep -m1 '^Linux version ' \
              || true

          fi

      # ==========================================================
      # PACKAGE
      # ==========================================================

      - name: Package GKI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          cp \
            out/arch/arm64/boot/Image \
            output/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then

            cp \
              out/arch/arm64/boot/Image.gz \
              output/Image.gz

          fi

          mkdir -p output/dtb

          find \
            out/arch/arm64/boot/dts \
            -type f \
            \( \
              -name '*.dtb' \
              -o \
              -name '*.dtbo' \
            \) \
            -exec cp {} output/dtb/ \; \
            || true

          cp \
            out/.config \
            output/kernel-config

          cat > output/build-info.txt <<EOF
          Kernel Name: ${{ inputs.KERNEL_NAME }}
          Kernel: 5.15
          Android: 13
          GKI Manifest: ${{ inputs.KERNEL_BRANCH }}
          Defconfig: ${{ inputs.DEFCONFIG_NAME }}
          Feature Set: ${{ inputs.FEATURE_SET }}
          KernelSU: ${{ inputs.ENABLE_KSU }}
          SUSFS: ${{ inputs.ENABLE_SUSFS }}
          BBG: ${{ inputs.ENABLE_BBG }}
          DroidSpaces: ${{ inputs.ENABLE_DROIDSPACES }}
          Networking: ${{ inputs.ENABLE_NETWORKING }}
          ccache: ${{ inputs.ENABLE_CCACHE }}
          Build Date: $(date -u)
          EOF

          cd output

          zip \
            -r \
            "../${{ inputs.KERNEL_NAME }}-GKI-5.15.zip" \
            .

      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload GKI Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-GKI-5.15
          path: ${{ inputs.KERNEL_NAME }}-GKI-5.15.zip
          if-no-files-found: error
          compression-level: 9

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: error

      - name: Upload Config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-config
          path: out/.config
          if-no-files-found: error
