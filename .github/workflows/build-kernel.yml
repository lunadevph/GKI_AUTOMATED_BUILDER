name: Build Kernel 5.15 KernelSU-Next + SuSFS

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source Repository (owner/repository)'
        required: true
        default: 'torvalds/linux'

      KERNEL_BRANCH:
        description: 'Kernel Source Branch'
        required: true
        default: 'main'

      DEFCONFIG_NAME:
        description: 'Defconfig File Name'
        required: true
        default: 'gki_defconfig'

      KERNEL_NAME:
        description: 'Kernel Name Suffix (example: PureKernel-LunaDevPH)'
        required: true
        default: '-PureKernel-LunaDevPH'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.KERNEL_SOURCE }}
          ref: ${{ github.event.inputs.KERNEL_BRANCH }}
          path: kernel_workspace
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            build-essential \
            zip \
            curl \
            git \
            wget \
            clang \
            llvm \
            lld

      - name: Check Kernel Source
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "Kernel source:"
          git remote -v

          echo
          echo "Kernel branch:"
          git branch --show-current

          echo
          echo "Checking kernel tree..."

          test -d drivers || {
            echo "ERROR: drivers/ directory not found."
            exit 1
          }

          test -d arch/arm64 || {
            echo "ERROR: arch/arm64/ directory not found."
            exit 1
          }

          echo "Kernel source looks valid."

      - name: Integrate KernelSU-Next
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "Downloading KernelSU-Next setup script..."

          curl -fL \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" \
            -o /tmp/ksu-next-setup.sh

          test -s /tmp/ksu-next-setup.sh || {
            echo "ERROR: KernelSU-Next setup script is empty."
            exit 1
          }

          echo "KernelSU-Next setup script downloaded successfully."

          chmod +x /tmp/ksu-next-setup.sh

          /tmp/ksu-next-setup.sh dev

      - name: Clone SuSFS
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "Cloning SuSFS 1.4.2 Android 13 / Kernel 5.15..."

          git clone \
            --depth=1 \
            --branch 1.4.2-gki-android13-5.15 \
            --single-branch \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          test -d susfs || {
            echo "ERROR: SuSFS repository was not cloned."
            exit 1
          }

          echo "SuSFS cloned successfully."

      - name: Verify SuSFS Files
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "Checking required SuSFS files..."

          test -f susfs/kernel_patches/fs/susfs.c || {
            echo "ERROR: susfs.c not found."
            exit 1
          }

          test -f susfs/kernel_patches/include/linux/susfs.h || {
            echo "ERROR: susfs.h not found."
            exit 1
          }

          test -f susfs/kernel_patches/5.15/5.15_ksu_susfs.patch || {
            echo "ERROR: 5.15 SuSFS patch not found."
            exit 1
          }

          test -f susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || {
            echo "ERROR: KernelSU SuSFS patch not found."
            exit 1
          }

          echo "All required SuSFS files found."

      - name: Apply SuSFS Kernel Patch
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "Copying SuSFS kernel files..."

          cp \
            susfs/kernel_patches/fs/susfs.c \
            fs/susfs.c

          cp \
            susfs/kernel_patches/include/linux/susfs.h \
            include/linux/susfs.h

          echo "Applying Linux 5.15 SuSFS patch..."

          patch -p1 \
            < susfs/kernel_patches/5.15/5.15_ksu_susfs.patch

      - name: Apply SuSFS KernelSU-Next Patch
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: drivers/kernelsu was not created by KernelSU-Next."
            exit 1
          fi

          cd drivers/kernelsu

          echo "Applying SuSFS KernelSU integration patch..."

          patch -p1 \
            < ../../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

      - name: Configure Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          DEFCONFIG_PATH="$(find arch/arm64/configs \
            -type f \
            -name "${{ github.event.inputs.DEFCONFIG_NAME }}" \
            | head -n 1)"

          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "ERROR: Defconfig '${{ github.event.inputs.DEFCONFIG_NAME }}' not found."
            exit 1
          fi

          echo "Using defconfig:"
          echo "$DEFCONFIG_PATH"

          echo "Kernel name:"
          echo "${{ github.event.inputs.KERNEL_NAME }}"

          cat >> "$DEFCONFIG_PATH" <<EOF

          # KernelSU-Next
          CONFIG_KSU=y

          # SuSFS
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUD=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME-RELEASE=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y

          # Custom kernel name
          CONFIG_LOCALVERSION="-${{ github.event.inputs.KERNEL_NAME }}"
          EOF

      - name: Prepare Kernel Configuration
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          make \
            O=out \
            ARCH=arm64 \
            ${{ github.event.inputs.DEFCONFIG_NAME }}

      - name: Build Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "Starting kernel build..."

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1

      - name: Verify Kernel Image
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "Checking kernel output..."

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "Image found."
          else
            echo "ERROR: Kernel Image was not produced."
            exit 1
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz found."
          fi

          echo
          echo "Kernel version:"
          make -s \
            O=out \
            ARCH=arm64 \
            kernelversion

          echo
          echo "Configured local version:"
          grep '^CONFIG_LOCALVERSION=' out/.config || true

      - name: Pack Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          rm -rf output
          mkdir -p output

          cp \
            out/arch/arm64/boot/Image \
            output/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp \
              out/arch/arm64/boot/Image.gz \
              output/Image.gz
          fi

          cd output

          zip -9 \
            "kernel-${{ github.event.inputs.KERNEL_NAME }}.zip" \
            ./*

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ github.event.inputs.KERNEL_NAME }}
          path: kernel_workspace/output/kernel-${{ github.event.inputs.KERNEL_NAME }}.zip
          if-no-files-found: error
