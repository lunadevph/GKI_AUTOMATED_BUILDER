name: Build Android 13 GKI 5.15

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:

      KERNEL_BRANCH:
        description: "Google GKI manifest branch"
        required: true
        default: "common-android13-5.15"

      DEFCONFIG_NAME:
        description: "GKI defconfig"
        required: true
        default: "gki_defconfig"

      KERNEL_NAME:
        description: "Kernel LOCALVERSION"
        required: true
        default: "LunaGKI"

      FEATURE_SET:
        description: "Feature set"
        required: true
        type: choice
        default: "KSU,SUSFS"
        options:
          - "NONE"
          - "KSU"
          - "SUSFS"
          - "KSU,SUSFS"
          - "KSU,DROIDSPACES"
          - "KSU,NET"
          - "KSU,SUSFS,DROIDSPACES"
          - "KSU,SUSFS,NET"
          - "KSU,DROIDSPACES,NET"
          - "FULL"

      KSU_BRANCH:
        description: "KernelSU-Next branch"
        required: true
        default: "next"

      SUSFS_BRANCH:
        description: "SUSFS branch"
        required: true
        default: "gki-android13-5.15"

      ENABLE_KSU:
        description: "Enable KernelSU-Next"
        required: true
        type: boolean
        default: true

      ENABLE_SUSFS:
        description: "Enable SUSFS"
        required: true
        type: boolean
        default: true

      ENABLE_DROIDSPACES:
        description: "Enable DroidSpaces"
        required: true
        type: boolean
        default: false

      ENABLE_NETWORKING:
        description: "Enable networking features"
        required: true
        type: boolean
        default: false

      ENABLE_BTF:
        description: "Enable BTF"
        required: true
        type: boolean
        default: false

      ENABLE_CCACHE:
        description: "Enable ccache"
        required: true
        type: boolean
        default: true

      BUILD_JOBS:
        description: "Build jobs, 0 = automatic"
        required: true
        default: "0"


jobs:

  build:

    name: "${{ inputs.KERNEL_NAME }} - Android 13 GKI 5.15"

    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # AGGRESSIVE DISK CLEANUP
      # ============================================================

      - name: Free Disk Space
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DISK BEFORE CLEANUP"
          echo "=========================================="

          df -h

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/julia* \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /usr/share/gradle \
            /usr/share/miniconda \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/node \
            /opt/hostedtoolcache/Java \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/Rust \
            2>/dev/null || true

          sudo apt-get clean || true

          sudo rm -rf \
            /var/lib/apt/lists/* \
            /var/cache/apt/* \
            /tmp/* \
            /var/tmp/* \
            2>/dev/null || true

          docker system prune \
            --all \
            --force \
            --volumes \
            2>/dev/null || true

          echo

          echo "=========================================="
          echo "DISK AFTER CLEANUP"
          echo "=========================================="

          df -h


      # ============================================================
      # CREATE SWAP
      # ============================================================

      - name: Create Build Swap
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SETTING UP SWAP"
          echo "=========================================="

          sudo swapoff /swapfile 2>/dev/null || true

          sudo rm -f /swapfile

          sudo fallocate -l 8G /swapfile || \
            sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress

          sudo chmod 600 /swapfile

          sudo mkswap /swapfile

          sudo swapon /swapfile

          free -h

          swapon --show


      # ============================================================
      # DISK CHECK
      # ============================================================

      - name: Check Build Resources
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DISK"
          echo "=========================================="

          df -h

          echo

          echo "=========================================="
          echo "INODES"
          echo "=========================================="

          df -ih

          echo

          echo "=========================================="
          echo "MEMORY"
          echo "=========================================="

          free -h

          echo

          AVAILABLE_KB="$(df --output=avail "$GITHUB_WORKSPACE" | tail -1)"

          if [ "$AVAILABLE_KB" -lt 15728640 ]; then
            echo "WARNING: Less than 15 GiB free."
          fi


      # ============================================================
      # INSTALL GOOGLE REPO
      # ============================================================

      - name: Install Google Repo
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 2 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install \
            -y \
            --no-install-recommends \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            build-essential \
            zip \
            unzip \
            curl \
            wget \
            git \
            ccache \
            python3 \
            rsync \
            dwarves \
            lz4 \
            zstd \
            xz-utils \
            device-tree-compiler \
            gcc-aarch64-linux-gnu

          sudo apt-get clean

          sudo rm -rf /var/lib/apt/lists/*


      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        if: inputs.ENABLE_CCACHE
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gki-android13-5.15-${{ inputs.KERNEL_BRANCH }}-ccache
          restore-keys: |
            gki-android13-5.15-${{ inputs.KERNEL_BRANCH }}-
            gki-android13-5.15-

      - name: Configure ccache
        if: inputs.ENABLE_CCACHE
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ccache"

          ccache \
            --set-config=cache_dir="$HOME/.ccache"

          ccache \
            --set-config=max_size=6G

          ccache \
            --set-config=compression=true

          ccache \
            --set-config=compression_level=3

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          ccache --zero-stats


      # ============================================================
      # GOOGLE GKI INIT
      # ============================================================

      - name: Initialize Google GKI
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/gki"

          mkdir -p "$GITHUB_WORKSPACE/gki"

          cd "$GITHUB_WORKSPACE/gki"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${{ inputs.KERNEL_BRANCH }}" \
            --depth=1 \
            --no-clone-bundle \
            --no-tags


      # ============================================================
      # GOOGLE GKI SYNC
      # ============================================================

      - name: Sync Google GKI
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          repo sync \
            -c \
            -j4 \
            --no-tags \
            --optimized-fetch \
            --prune

          repo status


      # ============================================================
      # VERIFY GKI
      # ============================================================

      - name: Verify GKI
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          test -d arch/arm64

          test -d arch/arm64/configs

          test -f \
            "arch/arm64/configs/${{ inputs.DEFCONFIG_NAME }}"

          echo "GKI source verified."


      # ============================================================
      # KERNELSU NEXT
      # ============================================================

      - name: Setup KernelSU-Next
        if: inputs.ENABLE_KSU || contains(inputs.FEATURE_SET, 'KSU') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALLING KERNELSU-NEXT"
          echo "=========================================="

          curl \
            -fLSs \
            --retry 5 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ inputs.KSU_BRANCH }}/kernel/setup.sh" \
            | bash -s "${{ inputs.KSU_BRANCH }}"

          test -d drivers/kernelsu

          echo "KernelSU-Next installed."


      # ============================================================
      # SUSFS
      # ============================================================

      - name: Setup SUSFS
        if: inputs.ENABLE_SUSFS || contains(inputs.FEATURE_SET, 'SUSFS') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SETTING UP SUSFS"
          echo "=========================================="

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch "${{ inputs.SUSFS_BRANCH }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          PATCH=""

          for CANDIDATE in \
            susfs/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch \
            susfs/kernel_patches/50_add_susfs_in_kernel-5.15.patch \
            susfs/kernel_patches/50_add_susfs_in_kernel-5.15-gki.patch
          do
            if [ -f "$CANDIDATE" ]; then
              PATCH="$CANDIDATE"
              break
            fi
          done

          if [ -z "$PATCH" ]; then
            echo "ERROR: SUSFS patch not found."

            find \
              susfs/kernel_patches \
              -type f \
              | sort

            exit 1
          fi

          echo "Using patch:"
          echo "$PATCH"

          if [ -d susfs/kernel_patches/fs ]; then
            cp -a \
              susfs/kernel_patches/fs/. \
              common/fs/
          fi

          if [ -d susfs/kernel_patches/include/linux ]; then
            cp -a \
              susfs/kernel_patches/include/linux/. \
              common/include/linux/
          fi

          cd common

          patch \
            --forward \
            --batch \
            -p1 \
            < "../$PATCH"

          KSU_PATCH="../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ -f "$KSU_PATCH" ]; then

            patch \
              --forward \
              --batch \
              -p1 \
              < "$KSU_PATCH" \
              || true

          fi

          echo "SUSFS setup completed."


      # ============================================================
      # DROIDSPACES
      # ============================================================

      - name: Setup DroidSpaces
        if: inputs.ENABLE_DROIDSPACES || contains(inputs.FEATURE_SET, 'DROIDSPACES') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SETTING UP DROIDSPACES"
          echo "=========================================="

          rm -rf Droidspaces-OSS

          git clone \
            --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            Droidspaces-OSS

          DS_PATCH="$(
            find \
              Droidspaces-OSS/Documentation/resources/kernel-patches \
              -type f \
              -iname '*.patch' \
              | grep -Ei \
                '(gki|kabi|sysvipc)' \
              | head -n1 \
              || true
          )"

          if [ -n "$DS_PATCH" ]; then

            echo "Applying:"
            echo "$DS_PATCH"

            cd common

            patch \
              --forward \
              --batch \
              -p1 \
              < "../$DS_PATCH"

          else

            echo "WARNING: No DroidSpaces patch found."

          fi


      # ============================================================
      # DROIDSPACES CONFIG
      # ============================================================

      - name: Create DroidSpaces Config
        if: inputs.ENABLE_DROIDSPACES || contains(inputs.FEATURE_SET, 'DROIDSPACES') || inputs.FEATURE_SET == 'FULL'
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/droidspaces.config" <<'EOF'
          CONFIG_PID_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_BINFMT_MISC=y
          CONFIG_BINFMT_SCRIPT=y
          CONFIG_USER_NS=y
          EOF


      # ============================================================
      # NETWORK CONFIG
      # ============================================================

      - name: Create Networking Config
        if: inputs.ENABLE_NETWORKING || contains(inputs.FEATURE_SET, 'NET') || inputs.FEATURE_SET == 'FULL'
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/networking.config" <<'EOF'
          CONFIG_NET=y
          CONFIG_INET=y
          CONFIG_IPV6=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BBR=y
          EOF


      # ============================================================
      # CONFIGURE GKI
      # ============================================================

      - name: Configure GKI
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/out"

          rm -rf "$OUT"

          mkdir -p "$OUT"

          make \
            O="$OUT" \
            ARCH=arm64 \
            "${{ inputs.DEFCONFIG_NAME }}"

          scripts/config \
            --file "$OUT/.config" \
            --set-str CONFIG_LOCALVERSION \
            "-${{ inputs.KERNEL_NAME }}"

          # KERNELSU

          if [ "${{ inputs.ENABLE_KSU }}" = "true" ] || \
             [[ "${{ inputs.FEATURE_SET }}" == *"KSU"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            if grep -Rqs \
              '^config KSU$' \
              drivers/kernelsu \
              2>/dev/null; then

              scripts/config \
                --file "$OUT/.config" \
                --enable CONFIG_KSU

            fi

          fi

          # SUSFS

          if [ "${{ inputs.ENABLE_SUSFS }}" = "true" ] || \
             [[ "${{ inputs.FEATURE_SET }}" == *"SUSFS"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            for CONFIG in \
              CONFIG_KSU_SUSFS \
              CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
              CONFIG_KSU_SUSFS_SUS_PATH \
              CONFIG_KSU_SUSFS_SUS_MOUNT \
              CONFIG_KSU_SUSFS_SUS_KSTAT \
              CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUD \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              CONFIG_KSU_SUSFS_TRY_UMOUNT \
              CONFIG_KSU_SUSFS_SPOOF_UNAME_RELEASE \
              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            do

              NAME="${CONFIG#CONFIG_}"

              if grep -Rqs \
                "config ${NAME}" \
                . \
                --include='Kconfig' \
                --include='Kconfig.*' \
                2>/dev/null; then

                scripts/config \
                  --file "$OUT/.config" \
                  --enable "$CONFIG"

              fi

            done

          fi

          # APPLY CONFIG FILE FUNCTION

          apply_config() {

            local FILE="$1"

            [ -f "$FILE" ] || return 0

            while IFS='=' read -r KEY VALUE; do

              [ -z "$KEY" ] && continue

              case "$VALUE" in

                y)
                  scripts/config \
                    --file "$OUT/.config" \
                    --enable "$KEY"
                  ;;

                m)
                  scripts/config \
                    --file "$OUT/.config" \
                    --module "$KEY"
                  ;;

                n)
                  scripts/config \
                    --file "$OUT/.config" \
                    --disable "$KEY"
                  ;;

              esac

            done < "$FILE"

          }

          apply_config "$GITHUB_WORKSPACE/droidspaces.config"

          apply_config "$GITHUB_WORKSPACE/networking.config"

          # BTF

          if [ "${{ inputs.ENABLE_BTF }}" = "true" ]; then

            scripts/config \
              --file "$OUT/.config" \
              --enable CONFIG_DEBUG_INFO

            scripts/config \
              --file "$OUT/.config" \
              --enable CONFIG_DEBUG_INFO_BTF

          fi

          make \
            O="$OUT" \
            ARCH=arm64 \
            olddefconfig

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_SUSFS|CONFIG_SYSVIPC=|CONFIG_IPC_NS=|CONFIG_PID_NS=|CONFIG_DEBUG_INFO_BTF=' \
            "$OUT/.config" \
            || true


      # ============================================================
      # LOCATE CLANG
      # ============================================================

      - name: Locate Google Clang
        shell: bash
        run: |
          set -euo pipefail

          CLANG_ROOT="$(
            find \
              "$GITHUB_WORKSPACE/gki/prebuilts/clang/host/linux-x86" \
              -type f \
              -name clang \
              -executable \
              -printf '%h\n' \
              2>/dev/null \
              | sed 's:/bin$::' \
              | sort -r \
              | head -n1
          )"

          if [ -z "$CLANG_ROOT" ]; then

            echo "ERROR: Google Clang not found."

            find \
              "$GITHUB_WORKSPACE/gki/prebuilts" \
              -type f \
              -name clang \
              2>/dev/null \
              | head -20

            exit 1

          fi

          echo "CLANG_ROOT=$CLANG_ROOT" >> "$GITHUB_ENV"

          echo "Using Google Clang:"
          echo "$CLANG_ROOT"


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build GKI Kernel
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.BUILD_JOBS }}" = "0" ]; then

            JOBS="$(nproc)"

          else

            JOBS="${{ inputs.BUILD_JOBS }}"

          fi

          # Avoid exhausting memory and swap.

          if [ "$JOBS" -gt 4 ]; then
            JOBS=4
          fi

          export PATH="$CLANG_ROOT/bin:$PATH"

          if [ "${{ inputs.ENABLE_CCACHE }}" = "true" ]; then
            export PATH="/usr/lib/ccache:$PATH"
          fi

          echo "=========================================="
          echo "COMPILER"
          echo "=========================================="

          command -v clang

          clang --version

          echo

          echo "Build jobs: $JOBS"

          # The Google Android 5.15 tree can trigger
          # -Wframe-larger-than in io_uring with newer Clang.
          # Disable that warning-as-error for this build.

          export KCFLAGS="-Wno-error=frame-larger-than"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="$KCFLAGS" \
            -j"$JOBS" \
            Image \
            Image.gz \
            dtbs


      # ============================================================
      # CCACHE STATS
      # ============================================================

      - name: ccache Statistics
        if: always()
        shell: bash
        run: |
          ccache --show-stats || true

          ccache --show-cache || true


      # ============================================================
      # VERIFY OUTPUT
      # ============================================================

      - name: Verify Kernel
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            out/arch/arm64/boot/Image

          echo "=========================================="
          echo "KERNEL OUTPUT"
          echo "=========================================="

          ls -lh \
            out/arch/arm64/boot/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then

            ls -lh \
              out/arch/arm64/boot/Image.gz

          fi

          echo

          strings \
            out/arch/arm64/boot/Image \
            | grep \
              -m1 \
              '^Linux version ' \
            || true


      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Kernel
        shell: bash
        run: |
          set -euo pipefail

          rm -rf output

          mkdir -p output

          cp \
            out/arch/arm64/boot/Image \
            output/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then

            cp \
              out/arch/arm64/boot/Image.gz \
              output/Image.gz

          fi

          cp \
            out/.config \
            output/kernel-config

          cat > output/build-info.txt <<EOF
          Kernel Name: ${{ inputs.KERNEL_NAME }}
          Android: 13
          Kernel: 5.15
          Manifest: ${{ inputs.KERNEL_BRANCH }}
          Defconfig: ${{ inputs.DEFCONFIG_NAME }}
          Feature Set: ${{ inputs.FEATURE_SET }}
          KernelSU: ${{ inputs.ENABLE_KSU }}
          SUSFS: ${{ inputs.ENABLE_SUSFS }}
          DroidSpaces: ${{ inputs.ENABLE_DROIDSPACES }}
          Networking: ${{ inputs.ENABLE_NETWORKING }}
          BTF: ${{ inputs.ENABLE_BTF }}
          ccache: ${{ inputs.ENABLE_CCACHE }}
          Build Date: $(date -u)
          EOF

          cd output

          zip \
            -9 \
            -r \
            "../${{ inputs.KERNEL_NAME }}-GKI-5.15.zip" \
            .


      # ============================================================
      # CLEAN SOURCE BEFORE ARTIFACT UPLOAD
      # ============================================================

      - name: Free Space Before Upload
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$GITHUB_WORKSPACE/gki/.repo/project-objects" \
            "$GITHUB_WORKSPACE/gki/.repo/projects" \
            2>/dev/null || true

          df -h


      # ============================================================
      # UPLOAD PACKAGE
      # ============================================================

      - name: Upload Kernel Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-GKI-5.15
          path: |
            ${{ inputs.KERNEL_NAME }}-GKI-5.15.zip
            output/build-info.txt
          if-no-files-found: error
          compression-level: 6


      # ============================================================
      # UPLOAD IMAGE
      # ============================================================

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: warn
          compression-level: 6


      # ============================================================
      # UPLOAD CONFIG
      # ============================================================

      - name: Upload Config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-Config
          path: out/.config
          if-no-files-found: warn
          compression-level: 6


      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Android 13 GKI 5.15 Build"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Kernel | ${{ inputs.KERNEL_NAME }} |"
            echo "| Manifest | ${{ inputs.KERNEL_BRANCH }} |"
            echo "| Defconfig | ${{ inputs.DEFCONFIG_NAME }} |"
            echo "| Features | ${{ inputs.FEATURE_SET }} |"
            echo "| KernelSU | ${{ inputs.ENABLE_KSU }} |"
            echo "| SUSFS | ${{ inputs.ENABLE_SUSFS }} |"
            echo "| DroidSpaces | ${{ inputs.ENABLE_DROIDSPACES }} |"
            echo "| Networking | ${{ inputs.ENABLE_NETWORKING }} |"
            echo "| BTF | ${{ inputs.ENABLE_BTF }} |"
            echo "| ccache | ${{ inputs.ENABLE_CCACHE }} |"
            echo
            echo "### Disk"
            echo '```'
            df -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
