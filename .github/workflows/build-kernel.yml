name: Build Kernel 5.15 KernelSU-Next + Features

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:

      KERNEL_SOURCE:
        description: "Kernel Source Repository"
        required: true
        default: "torvalds/linux"

      KERNEL_BRANCH:
        description: "Kernel Source Branch"
        required: true
        default: "master"

      DEFCONFIG_NAME:
        description: "Defconfig name"
        required: true
        default: "gki_defconfig"

      KERNEL_NAME:
        description: "Kernel local version/name"
        required: true
        default: "LunaKernel"

      FEATURE_SET:
        description: "Features: NONE, KSU, BBG, DS, NET or FULL"
        required: true
        default: "KSU"

      KSU_BRANCH:
        description: "KernelSU-Next branch/tag/commit"
        required: false
        default: "next"

      CLANG_VERSION:
        description: "Clang package version"
        required: false
        default: ""

      BUILD_JOBS:
        description: "Parallel build jobs"
        required: false
        default: "0"

jobs:

  build:

    name: "${{ inputs.KERNEL_NAME }} - ${{ inputs.KERNEL_SOURCE }}"

    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.KERNEL_SOURCE }}
          ref: ${{ inputs.KERNEL_BRANCH }}
          path: kernel_workspace
          fetch-depth: 1

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            build-essential \
            zip \
            unzip \
            curl \
            wget \
            git \
            ccache \
            python3 \
            python3-pip \
            rsync \
            dwarves \
            lz4 \
            zstd \
            xz-utils \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            clang \
            llvm \
            lld

      # ============================================================
      # MEMORY
      # ============================================================

      - name: Setup Swap
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-size-gb: 16

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ inputs.KERNEL_SOURCE }}-${{ inputs.KERNEL_BRANCH }}-${{ hashFiles('kernel_workspace/Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.KERNEL_SOURCE }}-${{ inputs.KERNEL_BRANCH }}-
            ccache-${{ runner.os }}-${{ inputs.KERNEL_SOURCE }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.ccache"

          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=10G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6

          ccache -z

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          echo "ccache configuration:"
          ccache -p

      # ============================================================
      # DETECT KERNEL TREE
      # ============================================================

      - name: Detect Kernel Tree
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -e

          echo "Kernel source:"
          git remote -v || true

          echo
          echo "Kernel version:"
          make kernelversion || true

          echo
          echo "Checking tree layout..."

          if [ -d "common/drivers" ]; then
            echo "Detected Android GKI common kernel tree."
            echo "KERNEL_ROOT=common" >> "$GITHUB_ENV"
          elif [ -d "drivers" ]; then
            echo "Detected standard kernel tree."
            echo "KERNEL_ROOT=." >> "$GITHUB_ENV"
          else
            echo "ERROR: Could not find drivers/ or common/drivers/."
            exit 1
          fi

      # ============================================================
      # KERNELSU-NEXT
      # ============================================================

      - name: Setup KernelSU-Next
        if: contains(inputs.FEATURE_SET, 'KSU') || inputs.FEATURE_SET == 'FULL'
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "KernelSU-Next"
          echo "=========================================="

          if [ ! -d "drivers" ] && [ ! -d "common/drivers" ]; then
            echo "ERROR: KernelSU-Next requires drivers/ or common/drivers/."
            exit 1
          fi

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s "${{ inputs.KSU_BRANCH }}"

          echo "KernelSU-Next installed."

      # ============================================================
      # BASEBAND GUARD
      # ============================================================

      - name: Setup Baseband Guard
        if: contains(inputs.FEATURE_SET, 'BBG') || inputs.FEATURE_SET == 'FULL'
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Baseband Guard"
          echo "=========================================="

          rm -rf baseband-guard

          git clone \
            --depth=1 \
            https://github.com/WildKernels/baseband-guard.git \
            baseband-guard

          cd baseband-guard

          echo "BBG files:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort

          if [ ! -f setup.sh ]; then
            echo "ERROR: BBG setup.sh not found."
            exit 1
          fi

          chmod +x setup.sh

          ./setup.sh

          cd ..

          echo "BBG source installed."

      # ============================================================
      # DROIDSPACES
      # ============================================================

      - name: Setup DroidSpaces-OSS
        if: contains(inputs.FEATURE_SET, 'DS') || inputs.FEATURE_SET == 'FULL'
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DroidSpaces-OSS"
          echo "=========================================="

          rm -rf Droidspaces-OSS

          git clone \
            --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            Droidspaces-OSS

          DS_ROOT="$PWD/Droidspaces-OSS"

          if [ "$KERNEL_ROOT" = "common" ]; then
            cd common
          fi

          PATCH="$DS_ROOT/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"

          if [ ! -f "$PATCH" ]; then
            echo "ERROR: DroidSpaces kABI patch not found:"
            echo "$PATCH"
            exit 1
          fi

          echo "Applying:"
          echo "$PATCH"

          patch -p1 < "$PATCH"

          echo "DroidSpaces kABI patch applied."

      # ============================================================
      # NETWORKING
      # ============================================================

      - name: Configure Networking
        if: contains(inputs.FEATURE_SET, 'NET') || inputs.FEATURE_SET == 'FULL'
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Networking"
          echo "=========================================="

          CONFIG_FRAGMENT="$PWD/networking.fragment"

          cat > "$CONFIG_FRAGMENT" <<'EOF'
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_WIREGUARD=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
          CONFIG_IP_SET=y
          CONFIG_IPV6=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP_NF_IPTABLES=y
          EOF

          echo "Networking fragment created."

      # ============================================================
      # DROIDSPACES CONFIG
      # ============================================================

      - name: Configure DroidSpaces
        if: contains(inputs.FEATURE_SET, 'DS') || inputs.FEATURE_SET == 'FULL'
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -e

          CONFIG_FRAGMENT="$PWD/droidspaces.fragment"

          cat > "$CONFIG_FRAGMENT" <<'EOF'
          CONFIG_PID_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_BINFMT_MISC=y
          CONFIG_BINFMT_SCRIPT=y
          CONFIG_BINFMT_ELF=y
          CONFIG_USER_NS=y
          EOF

          echo "DroidSpaces config fragment created."

      # ============================================================
      # GENERAL CONFIG
      # ============================================================

      - name: Prepare Defconfig
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Preparing Defconfig"
          echo "=========================================="

          DEFCONFIG_PATH=""

          if [ -d "arch/arm64/configs" ]; then
            DEFCONFIG_PATH=$(find arch/arm64/configs \
              -type f \
              -name "${{ inputs.DEFCONFIG_NAME }}" \
              | head -n 1)
          fi

          if [ -z "$DEFCONFIG_PATH" ] && [ -d "common/arch/arm64/configs" ]; then
            DEFCONFIG_PATH=$(find common/arch/arm64/configs \
              -type f \
              -name "${{ inputs.DEFCONFIG_NAME }}" \
              | head -n 1)
          fi

          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "ERROR: Defconfig not found:"
            echo "${{ inputs.DEFCONFIG_NAME }}"
            exit 1
          fi

          echo "Defconfig:"
          echo "$DEFCONFIG_PATH"

          echo "DEFCONFIG_PATH=$DEFCONFIG_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # BUILD DIRECTORY
      # ============================================================

      - name: Configure Kernel
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -e

          OUT="$PWD/out"

          rm -rf "$OUT"

          mkdir -p "$OUT"

          make \
            O="$OUT" \
            ARCH=arm64 \
            "${{ inputs.DEFCONFIG_NAME }}"

          # --------------------------------------------------------
          # Kernel name
          # --------------------------------------------------------

          scripts/config \
            --file "$OUT/.config" \
            --set-str LOCALVERSION "-${{ inputs.KERNEL_NAME }}"

          # --------------------------------------------------------
          # KernelSU
          # --------------------------------------------------------

          if [[ "${{ inputs.FEATURE_SET }}" == *"KSU"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            scripts/config \
              --file "$OUT/.config" \
              --enable CONFIG_KSU
          fi

          # --------------------------------------------------------
          # DroidSpaces
          # --------------------------------------------------------

          if [[ "${{ inputs.FEATURE_SET }}" == *"DS"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            while IFS= read -r config; do
              [ -z "$config" ] && continue

              key="${config%%=*}"
              value="${config#*=}"

              case "$value" in
                y)
                  scripts/config --file "$OUT/.config" --enable "$key"
                  ;;
                m)
                  scripts/config --file "$OUT/.config" --module "$key"
                  ;;
              esac
            done < "$PWD/droidspaces.fragment"
          fi

          # --------------------------------------------------------
          # Networking
          # --------------------------------------------------------

          if [[ "${{ inputs.FEATURE_SET }}" == *"NET"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            while IFS= read -r config; do
              [ -z "$config" ] && continue

              key="${config%%=*}"
              value="${config#*=}"

              case "$value" in
                y)
                  scripts/config --file "$OUT/.config" --enable "$key"
                  ;;
                m)
                  scripts/config --file "$OUT/.config" --module "$key"
                  ;;
              esac
            done < "$PWD/networking.fragment"
          fi

          # --------------------------------------------------------
          # BBG
          # --------------------------------------------------------

          if [[ "${{ inputs.FEATURE_SET }}" == *"BBG"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            echo "BBG selected."

            if grep -Rqs "BASEBAND_GUARD" \
              "$KERNEL_ROOT/Kconfig"* \
              "$KERNEL_ROOT/drivers" \
              "$KERNEL_ROOT/security" \
              2>/dev/null; then

              echo "BBG Kconfig symbols detected."

              grep -Rho \
                'CONFIG_[A-Z0-9_]*BASEBAND[A-Z0-9_]*' \
                baseband-guard \
                2>/dev/null \
                | sort -u || true
            fi
          fi

          # --------------------------------------------------------
          # Final configuration
          # --------------------------------------------------------

          make \
            O="$OUT" \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "Kernel configuration:"
          grep -E \
            'CONFIG_KSU=|CONFIG_LOCALVERSION=|CONFIG_USER_NS=|CONFIG_PID_NS=' \
            "$OUT/.config" || true

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Kernel
        working-directory: kernel_workspace
        shell: bash
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          set -e

          echo "=========================================="
          echo "Building Kernel"
          echo "=========================================="

          if [ "${{ inputs.BUILD_JOBS }}" = "0" ]; then
            JOBS="$(nproc)"
          else
            JOBS="${{ inputs.BUILD_JOBS }}"
          fi

          echo "Build jobs: $JOBS"

          export PATH="/usr/lib/ccache:$PATH"

          make \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            -j"$JOBS" \
            Image \
            Image.gz \
            dtbs

      # ============================================================
      # CCACHE STATISTICS
      # ============================================================

      - name: ccache Statistics
        if: always()
        shell: bash
        run: |
          ccache -s || true

      # ============================================================
      # SHOW KERNEL VERSION
      # ============================================================

      - name: Kernel Information
        working-directory: kernel_workspace
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "Kernel Information"
          echo "=========================================="

          if [ -f out/arch/arm64/boot/Image ]; then
            strings out/arch/arm64/boot/Image \
              | grep -m1 "^Linux version " \
              || true
          fi

          echo
          echo "Kernel name:"
          grep '^CONFIG_LOCALVERSION=' out/.config || true

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Kernel
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Packaging"
          echo "=========================================="

          rm -rf output

          mkdir -p output

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image output/
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz output/
          fi

          find out/arch/arm64/boot/dts \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp --parents {} output/ \; \
            2>/dev/null || true

          cp out/.config \
            output/kernel-config

          cat > output/build-info.txt <<EOF
          Kernel Name: ${{ inputs.KERNEL_NAME }}
          Kernel Source: ${{ inputs.KERNEL_SOURCE }}
          Kernel Branch: ${{ inputs.KERNEL_BRANCH }}
          Defconfig: ${{ inputs.DEFCONFIG_NAME }}
          Feature Set: ${{ inputs.FEATURE_SET }}
          KernelSU Branch: ${{ inputs.KSU_BRANCH }}
          Build Date: $(date -u)
          Runner: ${{ runner.os }}
          LLVM: $(clang --version | head -n 1)
          EOF

          cd output

          zip -r \
            "../${{ inputs.KERNEL_NAME }}-kernel.zip" \
            .

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-kernel
          path: kernel_workspace/${{ inputs.KERNEL_NAME }}-kernel.zip
          if-no-files-found: error
          compression-level: 9

      - name: Upload Raw Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-Image
          path: |
            kernel_workspace/out/arch/arm64/boot/Image
            kernel_workspace/out/arch/arm64/boot/Image.gz
          if-no-files-found: ignore

      - name: Upload Config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-config
          path: kernel_workspace/out/.config
          if-no-files-found: error
