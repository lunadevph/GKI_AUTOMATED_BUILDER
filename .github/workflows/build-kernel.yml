name: Build Android 13 GKI 5.15

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:

      KERNEL_BRANCH:
        description: "Google GKI manifest branch"
        required: true
        default: "common-android13-5.15"

      DEFCONFIG_NAME:
        description: "GKI defconfig"
        required: true
        default: "gki_defconfig"

      KERNEL_NAME:
        description: "Kernel LOCALVERSION / kernel name"
        required: true
        default: "LunaGKI"

      FEATURE_SET:
        description: "Feature set"
        required: true
        type: choice
        default: "KSU,SUSFS"
        options:
          - "NONE"
          - "KSU"
          - "SUSFS"
          - "KSU,SUSFS"
          - "KSU,DROIDSPACES"
          - "KSU,NET"
          - "KSU,SUSFS,DROIDSPACES"
          - "KSU,SUSFS,NET"
          - "KSU,DROIDSPACES,NET"
          - "FULL"

      KSU_BRANCH:
        description: "KernelSU-Next branch"
        required: false
        default: "next"

      SUSFS_BRANCH:
        description: "SUSFS branch/tag"
        required: false
        default: "gki-android13-5.15"

      ENABLE_KSU:
        description: "Enable KernelSU-Next"
        required: true
        type: boolean
        default: true

      ENABLE_SUSFS:
        description: "Enable SUSFS"
        required: true
        type: boolean
        default: true

      ENABLE_DROIDSPACES:
        description: "Enable DroidSpaces"
        required: true
        type: boolean
        default: false

      ENABLE_NETWORKING:
        description: "Enable networking features"
        required: true
        type: boolean
        default: false

      ENABLE_BTF:
        description: "Enable BTF"
        required: true
        type: boolean
        default: true

      ENABLE_CCACHE:
        description: "Enable ccache"
        required: true
        type: boolean
        default: true

      BUILD_JOBS:
        description: "Build jobs, 0 = automatic"
        required: true
        default: "0"


jobs:

  build:

    name: "${{ inputs.KERNEL_NAME }} - Android 13 GKI 5.15"

    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # DISK CLEANUP
      # ============================================================

      - name: Free Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          overprovision-lvm: true

      - name: Aggressive Workspace Cleanup
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk before cleanup:"
          df -h

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/julia \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /usr/share/gradle \
            /usr/share/miniconda \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/node \
            /opt/hostedtoolcache/Java \
            2>/dev/null || true

          sudo apt-get clean || true

          sudo rm -rf \
            /var/lib/apt/lists/* \
            /var/cache/apt/* \
            /tmp/* \
            /var/tmp/* \
            2>/dev/null || true

          docker system prune -af 2>/dev/null || true

          echo
          echo "Disk after cleanup:"
          df -h

      - name: Check Disk
        shell: bash
        run: |
          set -euo pipefail

          echo "Filesystem:"
          df -h

          echo
          echo "Inodes:"
          df -ih

          echo
          echo "Memory:"
          free -h

          echo
          echo "Swap:"
          swapon --show || true

          AVAILABLE_KB="$(df --output=avail "$GITHUB_WORKSPACE" | tail -1)"

          if [ "$AVAILABLE_KB" -lt 10485760 ]; then
            echo "ERROR: Less than 10 GiB available."
            df -h
            exit 1
          fi

      # ============================================================
      # REPO
      # ============================================================

      - name: Install Google Repo
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            build-essential \
            zip \
            unzip \
            curl \
            wget \
            git \
            ccache \
            python3 \
            python3-pip \
            rsync \
            dwarves \
            lz4 \
            zstd \
            xz-utils \
            device-tree-compiler \
            gcc-aarch64-linux-gnu

          sudo apt-get clean

          sudo rm -rf /var/lib/apt/lists/*

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        if: inputs.ENABLE_CCACHE
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gki-android13-5.15-${{ inputs.KERNEL_BRANCH }}-${{ hashFiles('.github/workflows/**') }}
          restore-keys: |
            gki-android13-5.15-${{ inputs.KERNEL_BRANCH }}-
            gki-android13-5.15-

      - name: Configure ccache
        if: inputs.ENABLE_CCACHE
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ccache"

          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=8G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=5

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          ccache --zero-stats
          ccache --show-config

      # ============================================================
      # GOOGLE GKI
      # ============================================================

      - name: Initialize Google GKI
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/gki"

          mkdir -p "$GITHUB_WORKSPACE/gki"

          cd "$GITHUB_WORKSPACE/gki"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${{ inputs.KERNEL_BRANCH }}" \
            --depth=1 \
            --no-clone-bundle \
            --no-tags

      - name: Sync Google GKI
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          repo sync \
            -c \
            -j"$(nproc)" \
            --no-tags \
            --optimized-fetch \
            --prune

          repo status

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify GKI
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          test -d arch/arm64
          test -d arch/arm64/configs
          test -f "arch/arm64/configs/${{ inputs.DEFCONFIG_NAME }}"

          echo "GKI source verified."

          echo "GKI_ROOT=$GITHUB_WORKSPACE/gki" >> "$GITHUB_ENV"
          echo "KERNEL_ROOT=$GITHUB_WORKSPACE/gki/common" >> "$GITHUB_ENV"

      # ============================================================
      # KERNELSU
      # ============================================================

      - name: Setup KernelSU-Next
        if: inputs.ENABLE_KSU || contains(inputs.FEATURE_SET, 'KSU') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ inputs.KSU_BRANCH }}/kernel/setup.sh" \
            | bash -s "${{ inputs.KSU_BRANCH }}"

          test -d drivers/kernelsu

          echo "KernelSU-Next installed."

      # ============================================================
      # SUSFS
      # ============================================================

      - name: Setup SUSFS
        if: inputs.ENABLE_SUSFS || contains(inputs.FEATURE_SET, 'SUSFS') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch "${{ inputs.SUSFS_BRANCH }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          echo "SUSFS repository cloned."

          PATCH="susfs/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

          if [ ! -f "$PATCH" ]; then
            echo "ERROR: Expected SUSFS patch does not exist:"
            echo "$PATCH"

            find susfs/kernel_patches \
              -maxdepth 2 \
              -type f \
              | sort

            exit 1
          fi

          # SUSFS source files
          cp \
            susfs/kernel_patches/fs/* \
            common/fs/

          cp \
            susfs/kernel_patches/include/linux/* \
            common/include/linux/

          # Main GKI SUSFS patch
          cd common

          patch \
            --forward \
            --batch \
            -p1 \
            < "../$PATCH"

          # KernelSU integration
          KSU_PATCH="../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ -f "$KSU_PATCH" ]; then

            patch \
              --forward \
              --batch \
              -p1 \
              < "$KSU_PATCH" \
              || echo "KernelSU SUSFS integration was already applied."

          fi

          echo "SUSFS successfully applied."

      # ============================================================
      # DROIDSPACES
      # ============================================================

      - name: Setup DroidSpaces
        if: inputs.ENABLE_DROIDSPACES || contains(inputs.FEATURE_SET, 'DROIDSPACES') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Droidspaces-OSS

          git clone \
            --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            Droidspaces-OSS

          echo "DroidSpaces repository cloned."

          cd common

          DS_PATCH=""

          for PATCH in \
            ../Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kABI_6_7_8.patch \
            ../Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          do
            if [ -f "$PATCH" ]; then
              DS_PATCH="$PATCH"
              break
            fi
          done

          if [ -z "$DS_PATCH" ]; then
            echo "ERROR: DroidSpaces GKI 5.15 kABI patch not found."

            find ../Droidspaces-OSS/Documentation/resources/kernel-patches \
              -type f \
              | sort

            exit 1
          fi

          echo "Applying DroidSpaces kABI patch:"
          echo "$DS_PATCH"

          patch \
            --forward \
            --batch \
            -p1 \
            < "$DS_PATCH"

          echo "DroidSpaces kABI patch applied."

      # ============================================================
      # DROIDSPACES CONFIG
      # ============================================================

      - name: Configure DroidSpaces
        if: inputs.ENABLE_DROIDSPACES || contains(inputs.FEATURE_SET, 'DROIDSPACES') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          cat >> "$GITHUB_WORKSPACE/droidspaces.config" <<'EOF'
          CONFIG_PID_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_BINFMT_MISC=y
          CONFIG_BINFMT_SCRIPT=y
          CONFIG_BINFMT_ELF=y
          CONFIG_USER_NS=y
          EOF

      # ============================================================
      # NETWORKING
      # ============================================================

      - name: Configure Networking
        if: inputs.ENABLE_NETWORKING || contains(inputs.FEATURE_SET, 'NET') || inputs.FEATURE_SET == 'FULL'
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/networking.config" <<'EOF'
          CONFIG_NET=y
          CONFIG_INET=y
          CONFIG_IPV6=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BBR=y
          EOF

      # ============================================================
      # CONFIG
      # ============================================================

      - name: Configure GKI
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/out"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          make \
            O="$OUT" \
            ARCH=arm64 \
            "${{ inputs.DEFCONFIG_NAME }}"

          scripts/config \
            --file "$OUT/.config" \
            --set-str CONFIG_LOCALVERSION \
            "-${{ inputs.KERNEL_NAME }}"

          # KernelSU
          if [ "${{ inputs.ENABLE_KSU }}" = "true" ] || \
             [[ "${{ inputs.FEATURE_SET }}" == *"KSU"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            if grep -Rqs '^config KSU$' drivers/kernelsu 2>/dev/null; then
              scripts/config \
                --file "$OUT/.config" \
                --enable CONFIG_KSU
            fi

          fi

          # SUSFS
          if [ "${{ inputs.ENABLE_SUSFS }}" = "true" ] || \
             [[ "${{ inputs.FEATURE_SET }}" == *"SUSFS"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            for CONFIG in \
              CONFIG_KSU_SUSFS \
              CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
              CONFIG_KSU_SUSFS_SUS_PATH \
              CONFIG_KSU_SUSFS_SUS_MOUNT \
              CONFIG_KSU_SUSFS_SUS_KSTAT \
              CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUD \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              CONFIG_KSU_SUSFS_TRY_UMOUNT \
              CONFIG_KSU_SUSFS_SPOOF_UNAME_RELEASE \
              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            do
              NAME="${CONFIG#CONFIG_}"

              if grep -Rqs \
                "config ${NAME}" \
                . \
                --include='Kconfig' \
                --include='Kconfig.*' \
                2>/dev/null
              then
                scripts/config \
                  --file "$OUT/.config" \
                  --enable "$CONFIG"
              fi
            done

          fi

          # DroidSpaces
          if [ -f "$GITHUB_WORKSPACE/droidspaces.config" ]; then
            while IFS='=' read -r KEY VALUE; do
              [ -z "$KEY" ] && continue

              case "$VALUE" in
                y)
                  scripts/config --file "$OUT/.config" --enable "$KEY"
                  ;;
                m)
                  scripts/config --file "$OUT/.config" --module "$KEY"
                  ;;
              esac
            done < "$GITHUB_WORKSPACE/droidspaces.config"
          fi

          # Networking
          if [ -f "$GITHUB_WORKSPACE/networking.config" ]; then
            while IFS='=' read -r KEY VALUE; do
              [ -z "$KEY" ] && continue

              case "$VALUE" in
                y)
                  scripts/config --file "$OUT/.config" --enable "$KEY"
                  ;;
                m)
                  scripts/config --file "$OUT/.config" --module "$KEY"
                  ;;
              esac
            done < "$GITHUB_WORKSPACE/networking.config"
          fi

          # BTF
          if [ "${{ inputs.ENABLE_BTF }}" = "true" ]; then

            scripts/config \
              --file "$OUT/.config" \
              --enable CONFIG_DEBUG_INFO

            scripts/config \
              --file "$OUT/.config" \
              --enable CONFIG_DEBUG_INFO_BTF

          fi

          make \
            O="$OUT" \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_SUSFS|CONFIG_SYSVIPC=|CONFIG_IPC_NS=|CONFIG_PID_NS=|CONFIG_DEBUG_INFO_BTF=' \
            "$OUT/.config" \
            || true

      # ============================================================
      # FIND GOOGLE CLANG
      # ============================================================

      - name: Locate Google Clang
        shell: bash
        run: |
          set -euo pipefail

          CLANG_ROOT="$(
            find \
              "$GITHUB_WORKSPACE/gki/prebuilts/clang/host/linux-x86" \
              -mindepth 1 \
              -maxdepth 2 \
              -type f \
              -name clang \
              -executable \
              -printf '%h\n' \
              2>/dev/null \
              | sed 's:/bin$::' \
              | sort -r \
              | head -n1
          )"

          if [ -z "$CLANG_ROOT" ]; then
            echo "ERROR: Google Clang not found."
            exit 1
          fi

          echo "CLANG_ROOT=$CLANG_ROOT" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$CLANG_ROOT"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build GKI Kernel
        working-directory: gki/common
        shell: bash
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          set -euo pipefail

          if [ "${{ inputs.BUILD_JOBS }}" = "0" ]; then
            JOBS="$(nproc)"
          else
            JOBS="${{ inputs.BUILD_JOBS }}"
          fi

          export PATH="$CLANG_ROOT/bin:$PATH"

          # ccache must wrap clang through PATH.
          if [ "${{ inputs.ENABLE_CCACHE }}" = "true" ]; then
            export PATH="/usr/lib/ccache:$PATH"
          fi

          echo "Compiler:"
          command -v clang
          clang --version

          echo
          echo "Build jobs: $JOBS"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$JOBS" \
            Image \
            Image.gz \
            dtbs

      # ============================================================
      # CCACHE STATS
      # ============================================================

      - name: ccache Statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats || true
            ccache --show-cache || true
          fi

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify Kernel
        shell: bash
        run: |
          set -euo pipefail

          test -s out/arch/arm64/boot/Image

          echo "Kernel:"
          ls -lh out/arch/arm64/boot/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            ls -lh out/arch/arm64/boot/Image.gz
          fi

          echo
          echo "Linux version:"

          strings \
            out/arch/arm64/boot/Image \
            | grep -m1 '^Linux version ' \
            || true

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf output

          mkdir -p output

          cp \
            out/arch/arm64/boot/Image \
            output/Image

          [ ! -f out/arch/arm64/boot/Image.gz ] || \
            cp out/arch/arm64/boot/Image.gz output/Image.gz

          cp \
            out/.config \
            output/kernel-config

          cat > output/build-info.txt <<EOF
          Kernel Name: ${{ inputs.KERNEL_NAME }}
          Android: 13
          Kernel: 5.15
          Manifest: ${{ inputs.KERNEL_BRANCH }}
          Defconfig: ${{ inputs.DEFCONFIG_NAME }}
          Feature Set: ${{ inputs.FEATURE_SET }}
          KernelSU: ${{ inputs.ENABLE_KSU }}
          SUSFS: ${{ inputs.ENABLE_SUSFS }}
          DroidSpaces: ${{ inputs.ENABLE_DROIDSPACES }}
          Networking: ${{ inputs.ENABLE_NETWORKING }}
          BTF: ${{ inputs.ENABLE_BTF }}
          ccache: ${{ inputs.ENABLE_CCACHE }}
          Build Date: $(date -u)
          EOF

          cd output

          zip \
            -9 \
            -r \
            "../${{ inputs.KERNEL_NAME }}-GKI-5.15.zip" \
            .

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-GKI-5.15
          path: |
            ${{ inputs.KERNEL_NAME }}-GKI-5.15.zip
            output/build-info.txt
          if-no-files-found: error
          compression-level: 9

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: error
          compression-level: 9

      - name: Upload Config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-Config
          path: out/.config
          if-no-files-found: error
          compression-level: 9

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## GKI 5.15 Build"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Kernel | ${{ inputs.KERNEL_NAME }} |"
            echo "| Android | 13 |"
            echo "| Linux | 5.15 |"
            echo "| Manifest | ${{ inputs.KERNEL_BRANCH }} |"
            echo "| Defconfig | ${{ inputs.DEFCONFIG_NAME }} |"
            echo "| Features | ${{ inputs.FEATURE_SET }} |"
            echo "| KernelSU | ${{ inputs.ENABLE_KSU }} |"
            echo "| SUSFS | ${{ inputs.ENABLE_SUSFS }} |"
            echo "| DroidSpaces | ${{ inputs.ENABLE_DROIDSPACES }} |"
            echo "| Networking | ${{ inputs.ENABLE_NETWORKING }} |"
            echo "| BTF | ${{ inputs.ENABLE_BTF }} |"
            echo "| ccache | ${{ inputs.ENABLE_CCACHE }} |"
          } >> "$GITHUB_STEP_SUMMARY"
