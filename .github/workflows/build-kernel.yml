name: Build Android 13 GKI 5.15

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:

      KERNEL_BRANCH:
        description: "Google GKI manifest branch"
        required: true
        default: "common-android13-5.15"

      DEFCONFIG_NAME:
        description: "GKI defconfig"
        required: true
        default: "gki_defconfig"

      KERNEL_NAME:
        description: "Kernel LOCALVERSION / kernel name"
        required: true
        default: "LunaGKI"

      FEATURE_SET:
        description: "Feature set"
        required: true
        type: choice
        default: "KSU,DROIDSPACES,NET"
        options:
          - "NONE"
          - "KSU"
          - "SUSFS"
          - "KSU,SUSFS"
          - "KSU,DROIDSPACES"
          - "KSU,NET"
          - "KSU,SUSFS,DROIDSPACES"
          - "KSU,SUSFS,NET"
          - "KSU,DROIDSPACES,NET"
          - "FULL"

      KSU_BRANCH:
        description: "KernelSU-Next branch"
        required: false
        default: "next"

      SUSFS_BRANCH:
        description: "SUSFS branch/tag"
        required: false
        default: "gki-android13-5.15"

      ENABLE_KSU:
        description: "Enable KernelSU-Next"
        required: true
        type: boolean
        default: true

      ENABLE_SUSFS:
        description: "Enable SUSFS"
        required: true
        type: boolean
        default: true

      ENABLE_DROIDSPACES:
        description: "Enable DroidSpaces"
        required: true
        type: boolean
        default: false

      ENABLE_NETWORKING:
        description: "Enable networking features"
        required: true
        type: boolean
        default: false

      ENABLE_BTF:
        description: "Enable BTF"
        required: true
        type: boolean
        default: true

      ENABLE_CCACHE:
        description: "Enable ccache"
        required: true
        type: boolean
        default: true

      BUILD_JOBS:
        description: "Build jobs, 0 = automatic"
        required: true
        default: "0"


jobs:

  build:

    name: "${{ inputs.KERNEL_NAME }} - Android 13 GKI 5.15"

    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # ============================================================
      # CHECKOUT BUILDER
      # ============================================================

      - name: Checkout Builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # MANUAL DISK CLEANUP
      #
      # IMPORTANT:
      # Do NOT use easimon/maximize-build-space here.
      #
      # The previous failure:
      #
      # fallocate: invalid length value specified
      #
      # occurred inside that action while creating its LVM
      # temporary backing file.
      # ============================================================

      - name: Free Disk Space
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DISK BEFORE CLEANUP"
          echo "=========================================="

          df -h
          df -ih

          echo
          echo "=========================================="
          echo "REMOVING LARGE PREINSTALLED SOFTWARE"
          echo "=========================================="

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/julia \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/share/gradle \
            /usr/share/miniconda \
            /opt/hostedtoolcache/CodeQL \
            2>/dev/null || true

          echo
          echo "=========================================="
          echo "CLEANING APT"
          echo "=========================================="

          sudo apt-get clean || true

          sudo rm -rf \
            /var/lib/apt/lists/* \
            /var/cache/apt/* \
            /tmp/* \
            /var/tmp/* \
            2>/dev/null || true

          echo
          echo "=========================================="
          echo "CLEANING DOCKER"
          echo "=========================================="

          docker system prune -af 2>/dev/null || true

          echo
          echo "=========================================="
          echo "DISK AFTER CLEANUP"
          echo "=========================================="

          df -h
          df -ih

      # ============================================================
      # RESOURCE CHECK
      # ============================================================

      - name: Check Runner Resources
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FILESYSTEM"
          echo "=========================================="

          df -h

          echo
          echo "=========================================="
          echo "INODES"
          echo "=========================================="

          df -ih

          echo
          echo "=========================================="
          echo "MEMORY"
          echo "=========================================="

          free -h

          echo
          echo "=========================================="
          echo "SWAP"
          echo "=========================================="

          swapon --show || true

          echo
          echo "=========================================="
          echo "CPU"
          echo "=========================================="

          nproc

          AVAILABLE_KB="$(
            df --output=avail "$GITHUB_WORKSPACE" |
            tail -1 |
            tr -d ' '
          )"

          AVAILABLE_GIB=$((AVAILABLE_KB / 1024 / 1024))

          echo
          echo "Available workspace storage: ${AVAILABLE_GIB} GiB"

          if [ "$AVAILABLE_KB" -lt $((10 * 1024 * 1024)) ]; then
            echo
            echo "ERROR: Less than 10 GiB of storage is available."
            df -h
            exit 1
          fi

      # ============================================================
      # GOOGLE REPO
      # ============================================================

      - name: Install Google Repo
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            build-essential \
            zip \
            unzip \
            curl \
            wget \
            git \
            ccache \
            python3 \
            python3-pip \
            rsync \
            dwarves \
            lz4 \
            zstd \
            xz-utils \
            device-tree-compiler \
            gcc-aarch64-linux-gnu

          sudo apt-get clean

          sudo rm -rf /var/lib/apt/lists/*

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        if: inputs.ENABLE_CCACHE
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gki-android13-5.15-${{ inputs.KERNEL_BRANCH }}-${{ hashFiles('.github/workflows/**') }}
          restore-keys: |
            gki-android13-5.15-${{ inputs.KERNEL_BRANCH }}-
            gki-android13-5.15-

      - name: Configure ccache
        if: inputs.ENABLE_CCACHE
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ccache"

          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=4G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=5

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          ccache --zero-stats

          echo
          echo "ccache configuration:"
          ccache --show-config

      # ============================================================
      # GOOGLE GKI INITIALIZATION
      # ============================================================

      - name: Initialize Google GKI
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/gki"

          mkdir -p "$GITHUB_WORKSPACE/gki"

          cd "$GITHUB_WORKSPACE/gki"

          echo "=========================================="
          echo "INITIALIZING GOOGLE GKI"
          echo "=========================================="

          echo "Manifest:"
          echo "${{ inputs.KERNEL_BRANCH }}"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${{ inputs.KERNEL_BRANCH }}" \
            --depth=1 \
            --no-clone-bundle \
            --no-tags

      # ============================================================
      # GOOGLE GKI SYNC
      #
      # -j4 deliberately used to reduce peak disk/RAM pressure.
      # ============================================================

      - name: Sync Google GKI
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SYNCING GOOGLE GKI"
          echo "=========================================="

          repo sync \
            -c \
            -j4 \
            --no-tags \
            --optimized-fetch \
            --prune

          echo
          echo "=========================================="
          echo "REPO STATUS"
          echo "=========================================="

          repo status

          echo
          echo "=========================================="
          echo "GKI SIZE"
          echo "=========================================="

          du -sh .

          echo
          echo "=========================================="
          echo "DISK"
          echo "=========================================="

          df -h

      # ============================================================
      # VERIFY GKI
      # ============================================================

      - name: Verify GKI Source
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING GKI"
          echo "=========================================="

          test -d arch/arm64

          test -d arch/arm64/configs

          test -f \
            "arch/arm64/configs/${{ inputs.DEFCONFIG_NAME }}"

          echo "GKI source verified."

          echo "GKI_ROOT=$GITHUB_WORKSPACE/gki" >> "$GITHUB_ENV"
          echo "KERNEL_ROOT=$GITHUB_WORKSPACE/gki/common" >> "$GITHUB_ENV"

      # ============================================================
      # DISK CHECK AFTER REPO SYNC
      # ============================================================

      - name: Check Disk After GKI Sync
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DISK AFTER GKI SYNC"
          echo "=========================================="

          df -h
          df -ih

          echo
          echo "Largest GKI directories:"

          du -xhd1 "$GITHUB_WORKSPACE/gki" 2>/dev/null |
            sort -h |
            tail -20

          AVAILABLE_KB="$(
            df --output=avail "$GITHUB_WORKSPACE" |
            tail -1 |
            tr -d ' '
          )"

          AVAILABLE_GIB=$((AVAILABLE_KB / 1024 / 1024))

          echo
          echo "Available: ${AVAILABLE_GIB} GiB"

          if [ "$AVAILABLE_KB" -lt $((8 * 1024 * 1024)) ]; then
            echo
            echo "ERROR: Less than 8 GiB remains after GKI sync."
            df -h
            exit 1
          fi

      # ============================================================
      # KERNELSU-NEXT
      # ============================================================

      - name: Setup KernelSU-Next
        if: inputs.ENABLE_KSU || contains(inputs.FEATURE_SET, 'KSU') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "KERNELSU-NEXT"
          echo "=========================================="

          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ inputs.KSU_BRANCH }}/kernel/setup.sh" \
            | bash -s "${{ inputs.KSU_BRANCH }}"

          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: KernelSU directory was not created."
            exit 1
          fi

          echo "KernelSU-Next installed."

          du -sh drivers/kernelsu || true

      # ============================================================
      # SUSFS
      # ============================================================

      - name: Setup SUSFS
        if: inputs.ENABLE_SUSFS || contains(inputs.FEATURE_SET, 'SUSFS') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SUSFS"
          echo "=========================================="

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch "${{ inputs.SUSFS_BRANCH }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          echo "SUSFS repository cloned."

          echo
          echo "=========================================="
          echo "SUSFS PATCH SEARCH"
          echo "=========================================="

          SUSFS_PATCH=""

          for candidate in \
            "susfs/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" \
            "susfs/kernel_patches/50_add_susfs_in_kernel-5.15.patch" \
            "susfs/kernel_patches/50_add_susfs_in_kernel-5.15-gki.patch"
          do
            if [ -f "$candidate" ]; then
              SUSFS_PATCH="$candidate"
              break
            fi
          done

          if [ -z "$SUSFS_PATCH" ]; then
            SUSFS_PATCH="$(
              find susfs/kernel_patches \
                -type f \
                -name '*.patch' \
                \( \
                  -iname '*5.15*' \
                  -o \
                  -iname '*gki*' \
                \) \
                | head -n 1 \
                || true
            )"
          fi

          if [ -z "$SUSFS_PATCH" ]; then
            echo "ERROR: No SUSFS GKI 5.15 patch found."

            echo
            echo "Available SUSFS patches:"

            find \
              susfs/kernel_patches \
              -type f \
              -name '*.patch' \
              | sort

            exit 1
          fi

          echo "Using SUSFS patch:"
          echo "$SUSFS_PATCH"

          # --------------------------------------------------------
          # COPY SUSFS SOURCE
          # --------------------------------------------------------

          if [ -d susfs/kernel_patches/fs ]; then
            find susfs/kernel_patches/fs \
              -maxdepth 1 \
              -type f \
              -exec cp {} common/fs/ \;
          fi

          if [ -d susfs/kernel_patches/include/linux ]; then
            find susfs/kernel_patches/include/linux \
              -maxdepth 1 \
              -type f \
              -exec cp {} common/include/linux/ \;
          fi

          # --------------------------------------------------------
          # APPLY MAIN SUSFS PATCH
          # --------------------------------------------------------

          cd common

          patch \
            --forward \
            --batch \
            -p1 \
            < "../$SUSFS_PATCH"

          # --------------------------------------------------------
          # KERNELSU SUSFS INTEGRATION
          # --------------------------------------------------------

          KSU_PATCH="../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ -f "$KSU_PATCH" ]; then

            echo
            echo "Applying KernelSU SUSFS integration..."

            patch \
              --forward \
              --batch \
              -p1 \
              < "$KSU_PATCH" \
              || echo "WARNING: KernelSU SUSFS integration was already applied or did not match."

          else

            echo "WARNING: KernelSU SUSFS integration patch not found."

          fi

          echo
          echo "SUSFS setup complete."

      # ============================================================
      # DROIDSPACES
      # ============================================================

      - name: Setup DroidSpaces
        if: inputs.ENABLE_DROIDSPACES || contains(inputs.FEATURE_SET, 'DROIDSPACES') || inputs.FEATURE_SET == 'FULL'
        working-directory: gki
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DROIDSPACES"
          echo "=========================================="

          rm -rf Droidspaces-OSS

          git clone \
            --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            Droidspaces-OSS

          echo "DroidSpaces repository cloned."

          cd common

          DS_PATCH=""

          for PATCH in \
            ../Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kABI_6_7_8.patch \
            ../Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          do
            if [ -f "$PATCH" ]; then
              DS_PATCH="$PATCH"
              break
            fi
          done

          if [ -z "$DS_PATCH" ]; then

            echo "ERROR: DroidSpaces GKI 5.15 kABI patch not found."

            echo
            echo "Available DroidSpaces patches:"

            find \
              ../Droidspaces-OSS/Documentation/resources/kernel-patches \
              -type f \
              | sort

            exit 1

          fi

          echo "Applying DroidSpaces patch:"
          echo "$DS_PATCH"

          patch \
            --forward \
            --batch \
            -p1 \
            < "$DS_PATCH"

          echo "DroidSpaces patch applied."

      # ============================================================
      # DROIDSPACES CONFIG
      # ============================================================

      - name: Configure DroidSpaces
        if: inputs.ENABLE_DROIDSPACES || contains(inputs.FEATURE_SET, 'DROIDSPACES') || inputs.FEATURE_SET == 'FULL'
        shell: bash
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/droidspaces.config" <<'EOF'
          CONFIG_PID_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_BINFMT_MISC=y
          CONFIG_BINFMT_SCRIPT=y
          CONFIG_BINFMT_ELF=y
          CONFIG_USER_NS=y
          EOF

      # ============================================================
      # NETWORKING CONFIG
      # ============================================================

      - name: Configure Networking
        if: inputs.ENABLE_NETWORKING || contains(inputs.FEATURE_SET, 'NET') || inputs.FEATURE_SET == 'FULL'
        shell: bash
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/networking.config" <<'EOF'
          CONFIG_NET=y
          CONFIG_INET=y
          CONFIG_IPV6=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BBR=y
          EOF

      # ============================================================
      # CONFIGURE GKI
      # ============================================================

      - name: Configure GKI
        working-directory: gki/common
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CONFIGURING GKI"
          echo "=========================================="

          OUT="$GITHUB_WORKSPACE/out"

          rm -rf "$OUT"

          mkdir -p "$OUT"

          make \
            O="$OUT" \
            ARCH=arm64 \
            "${{ inputs.DEFCONFIG_NAME }}"

          # --------------------------------------------------------
          # LOCALVERSION
          # --------------------------------------------------------

          scripts/config \
            --file "$OUT/.config" \
            --set-str CONFIG_LOCALVERSION \
            "-${{ inputs.KERNEL_NAME }}"

          # --------------------------------------------------------
          # KERNELSU
          # --------------------------------------------------------

          if [ "${{ inputs.ENABLE_KSU }}" = "true" ] || \
             [[ "${{ inputs.FEATURE_SET }}" == *"KSU"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            if grep -Rqs '^config KSU$' \
              drivers/kernelsu \
              2>/dev/null
            then

              scripts/config \
                --file "$OUT/.config" \
                --enable CONFIG_KSU

              echo "CONFIG_KSU enabled."

            else

              echo "WARNING: CONFIG_KSU Kconfig entry not found."

            fi

          fi

          # --------------------------------------------------------
          # SUSFS
          # --------------------------------------------------------

          if [ "${{ inputs.ENABLE_SUSFS }}" = "true" ] || \
             [[ "${{ inputs.FEATURE_SET }}" == *"SUSFS"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            echo "=========================================="
            echo "CONFIGURING SUSFS"
            echo "=========================================="

            for CONFIG in \
              CONFIG_KSU_SUSFS \
              CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
              CONFIG_KSU_SUSFS_SUS_PATH \
              CONFIG_KSU_SUSFS_SUS_MOUNT \
              CONFIG_KSU_SUSFS_SUS_KSTAT \
              CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUD \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              CONFIG_KSU_SUSFS_TRY_UMOUNT \
              CONFIG_KSU_SUSFS_SPOOF_UNAME_RELEASE \
              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            do

              NAME="${CONFIG#CONFIG_}"

              if grep -Rqs \
                "config ${NAME}" \
                . \
                --include='Kconfig' \
                --include='Kconfig.*' \
                2>/dev/null
              then

                scripts/config \
                  --file "$OUT/.config" \
                  --enable "$CONFIG"

                echo "Enabled: $CONFIG"

              else

                echo "Unavailable: $CONFIG"

              fi

            done

          else

            echo "SUSFS disabled."

          fi

          # --------------------------------------------------------
          # DROIDSPACES
          # --------------------------------------------------------

          if [ -f "$GITHUB_WORKSPACE/droidspaces.config" ]; then

            echo
            echo "Configuring DroidSpaces..."

            while IFS='=' read -r KEY VALUE; do

              [ -z "$KEY" ] && continue

              case "$VALUE" in

                y)
                  scripts/config \
                    --file "$OUT/.config" \
                    --enable "$KEY"
                  ;;

                m)
                  scripts/config \
                    --file "$OUT/.config" \
                    --module "$KEY"
                  ;;

              esac

            done < "$GITHUB_WORKSPACE/droidspaces.config"

          fi

          # --------------------------------------------------------
          # NETWORKING
          # --------------------------------------------------------

          if [ -f "$GITHUB_WORKSPACE/networking.config" ]; then

            echo
            echo "Configuring networking..."

            while IFS='=' read -r KEY VALUE; do

              [ -z "$KEY" ] && continue

              case "$VALUE" in

                y)
                  scripts/config \
                    --file "$OUT/.config" \
                    --enable "$KEY"
                  ;;

                m)
                  scripts/config \
                    --file "$OUT/.config" \
                    --module "$KEY"
                  ;;

              esac

            done < "$GITHUB_WORKSPACE/networking.config"

          fi

          # --------------------------------------------------------
          # BTF
          # --------------------------------------------------------

          if [ "${{ inputs.ENABLE_BTF }}" = "true" ]; then

            if grep -Rqs \
              '^config DEBUG_INFO$' \
              . \
              --include='Kconfig*' \
              2>/dev/null
            then

              scripts/config \
                --file "$OUT/.config" \
                --enable CONFIG_DEBUG_INFO

            fi

            if grep -Rqs \
              '^config DEBUG_INFO_BTF$' \
              . \
              --include='Kconfig*' \
              2>/dev/null
            then

              scripts/config \
                --file "$OUT/.config" \
                --enable CONFIG_DEBUG_INFO_BTF

            fi

          fi

          # --------------------------------------------------------
          # FINALIZE
          # --------------------------------------------------------

          make \
            O="$OUT" \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_SUSFS|CONFIG_SYSVIPC=|CONFIG_IPC_NS=|CONFIG_PID_NS=|CONFIG_USER_NS=|CONFIG_DEBUG_INFO_BTF=' \
            "$OUT/.config" \
            || true

      # ============================================================
      # LOCATE GOOGLE CLANG
      # ============================================================

      - name: Locate Google Clang
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LOCATING GOOGLE CLANG"
          echo "=========================================="

          CLANG_ROOT="$(
            find \
              "$GITHUB_WORKSPACE/gki/prebuilts/clang/host/linux-x86" \
              -mindepth 1 \
              -maxdepth 3 \
              -type f \
              -name clang \
              -executable \
              -printf '%h\n' \
              2>/dev/null \
              | sed 's:/bin$::' \
              | sort -r \
              | head -n1
          )"

          if [ -z "$CLANG_ROOT" ]; then

            echo "ERROR: Google Clang not found."

            find \
              "$GITHUB_WORKSPACE/gki/prebuilts/clang" \
              -type f \
              -name clang \
              2>/dev/null \
              | head -20 || true

            exit 1

          fi

          echo "CLANG_ROOT=$CLANG_ROOT" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$CLANG_ROOT"

      # ============================================================
      # DISK CHECK BEFORE BUILD
      # ============================================================

      - name: Check Disk Before Kernel Build
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DISK BEFORE BUILD"
          echo "=========================================="

          df -h
          df -ih

          echo
          echo "GKI size:"
          du -sh "$GITHUB_WORKSPACE/gki" 2>/dev/null || true

          echo
          echo "Output size:"
          du -sh "$GITHUB_WORKSPACE/out" 2>/dev/null || true

          AVAILABLE_KB="$(
            df --output=avail "$GITHUB_WORKSPACE" |
            tail -1 |
            tr -d ' '
          )"

          AVAILABLE_GIB=$((AVAILABLE_KB / 1024 / 1024))

          echo
          echo "Available: ${AVAILABLE_GIB} GiB"

          if [ "$AVAILABLE_KB" -lt $((8 * 1024 * 1024)) ]; then
            echo "ERROR: Less than 8 GiB available before compilation."
            exit 1
          fi

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build GKI Kernel
        working-directory: gki/common
        shell: bash
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING ANDROID 13 GKI 5.15"
          echo "=========================================="

          if [ "${{ inputs.BUILD_JOBS }}" = "0" ]; then

            CPU_COUNT="$(nproc)"

            # Avoid excessive memory/disk pressure.
            if [ "$CPU_COUNT" -gt 8 ]; then
              JOBS=8
            else
              JOBS="$CPU_COUNT"
            fi

          else

            JOBS="${{ inputs.BUILD_JOBS }}"

          fi

          export PATH="$CLANG_ROOT/bin:$PATH"

          if [ "${{ inputs.ENABLE_CCACHE }}" = "true" ]; then

            export PATH="/usr/lib/ccache:$PATH"

            echo "ccache enabled."

          else

            echo "ccache disabled."

          fi

          echo
          echo "Compiler:"
          command -v clang
          clang --version

          echo
          echo "Build jobs:"
          echo "$JOBS"

          echo
          echo "Disk before compilation:"
          df -h

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$JOBS" \
            Image \
            Image.gz \
            dtbs

      # ============================================================
      # CCACHE STATISTICS
      # ============================================================

      - name: ccache Statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then

            echo "=========================================="
            echo "CCACHE STATISTICS"
            echo "=========================================="

            ccache --show-stats || true

            echo
            ccache --show-config || true

          fi

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify Kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING KERNEL"
          echo "=========================================="

          test -s \
            out/arch/arm64/boot/Image

          echo
          echo "Kernel Image:"
          ls -lh \
            out/arch/arm64/boot/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then

            echo
            echo "Compressed Image:"
            ls -lh \
              out/arch/arm64/boot/Image.gz

          fi

          echo
          echo "Linux version:"

          strings \
            out/arch/arm64/boot/Image \
            | grep -m1 '^Linux version ' \
            || true

          echo
          echo "Final disk usage:"

          df -h

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PACKAGING"
          echo "=========================================="

          rm -rf output

          mkdir -p output

          cp \
            out/arch/arm64/boot/Image \
            output/Image

          if [ -f out/arch/arm64/boot/Image.gz ]; then

            cp \
              out/arch/arm64/boot/Image.gz \
              output/Image.gz

          fi

          cp \
            out/.config \
            output/kernel-config

          cat > output/build-info.txt <<EOF
          Kernel Name: ${{ inputs.KERNEL_NAME }}
          Android: 13
          Linux Kernel: 5.15
          Google Manifest: ${{ inputs.KERNEL_BRANCH }}
          Defconfig: ${{ inputs.DEFCONFIG_NAME }}

          Feature Set: ${{ inputs.FEATURE_SET }}

          KernelSU-Next: ${{ inputs.ENABLE_KSU }}
          SUSFS: ${{ inputs.ENABLE_SUSFS }}
          DroidSpaces: ${{ inputs.ENABLE_DROIDSPACES }}
          Networking: ${{ inputs.ENABLE_NETWORKING }}
          BTF: ${{ inputs.ENABLE_BTF }}
          ccache: ${{ inputs.ENABLE_CCACHE }}

          KSU Branch: ${{ inputs.KSU_BRANCH }}
          SUSFS Branch: ${{ inputs.SUSFS_BRANCH }}

          Build Date:
          $(date -u)

          GitHub Run:
          ${{ github.run_id }}

          ==========================================
          EOF

          echo
          echo "Output:"
          find output \
            -maxdepth 2 \
            -type f \
            -printf '%p %k KB\n' \
            | sort

      # ============================================================
      # CREATE ZIP
      #
      # -1 instead of -9 to reduce CPU/time/storage pressure.
      # ============================================================

      - name: Create Kernel ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd output

          zip \
            -1 \
            -r \
            "../${{ inputs.KERNEL_NAME }}-GKI-5.15.zip" \
            .

          cd ..

          echo
          echo "ZIP:"
          ls -lh \
            "${{ inputs.KERNEL_NAME }}-GKI-5.15.zip"

      # ============================================================
      # UPLOAD KERNEL PACKAGE
      # ============================================================

      - name: Upload Kernel Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-GKI-5.15
          path: |
            ${{ inputs.KERNEL_NAME }}-GKI-5.15.zip
            output/build-info.txt
          if-no-files-found: error
          compression-level: 1

      # ============================================================
      # UPLOAD RAW IMAGE
      # ============================================================

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: error
          compression-level: 1

      # ============================================================
      # UPLOAD CONFIG
      # ============================================================

      - name: Upload Kernel Config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-Config
          path: out/.config
          if-no-files-found: error
          compression-level: 1

      # ============================================================
      # FINAL DISK REPORT
      # ============================================================

      - name: Final Disk Report
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL DISK REPORT"
          echo "=========================================="

          df -h
          df -ih

          echo
          echo "Workspace:"
          du -sh "$GITHUB_WORKSPACE" 2>/dev/null || true

          echo
          echo "GKI:"
          du -sh "$GITHUB_WORKSPACE/gki" 2>/dev/null || true

          echo
          echo "Output:"
          du -sh "$GITHUB_WORKSPACE/out" 2>/dev/null || true

          echo
          echo "ccache:"
          du -sh "$HOME/.ccache" 2>/dev/null || true

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## GKI 5.15 Build"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Kernel | ${{ inputs.KERNEL_NAME }} |"
            echo "| Android | 13 |"
            echo "| Linux | 5.15 |"
            echo "| Google Manifest | ${{ inputs.KERNEL_BRANCH }} |"
            echo "| Defconfig | ${{ inputs.DEFCONFIG_NAME }} |"
            echo "| Features | ${{ inputs.FEATURE_SET }} |"
            echo "| KernelSU-Next | ${{ inputs.ENABLE_KSU }} |"
            echo "| SUSFS | ${{ inputs.ENABLE_SUSFS }} |"
            echo "| DroidSpaces | ${{ inputs.ENABLE_DROIDSPACES }} |"
            echo "| Networking | ${{ inputs.ENABLE_NETWORKING }} |"
            echo "| BTF | ${{ inputs.ENABLE_BTF }} |"
            echo "| ccache | ${{ inputs.ENABLE_CCACHE }} |"
            echo "| Build jobs | ${{ inputs.BUILD_JOBS }} |"
          } >> "$GITHUB_STEP_SUMMARY"
