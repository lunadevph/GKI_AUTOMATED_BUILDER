name: Build Android GKI 5.15

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:

      KERNEL_SOURCE:
        description: "GKI kernel repository"
        required: true
        default: "WildKernels/GKI_KernelSU_SUSFS"

      KERNEL_BRANCH:
        description: "GKI kernel branch"
        required: true
        default: "main"

      DEFCONFIG_NAME:
        description: "GKI defconfig"
        required: true
        default: "gki_defconfig"

      KERNEL_NAME:
        description: "Kernel LOCALVERSION name"
        required: true
        default: "LunaGKI"

      FEATURE_SET:
        description: "Feature set"
        required: true
        type: choice
        default: "KSU"
        options:
          - "NONE"
          - "KSU"
          - "SUSFS"
          - "KSU,SUSFS"
          - "KSU,BBG"
          - "KSU,DS"
          - "KSU,NET"
          - "KSU,SUSFS,BBG"
          - "KSU,SUSFS,DS"
          - "KSU,SUSFS,NET"
          - "KSU,SUSFS,BBG,DS"
          - "KSU,SUSFS,BBG,NET"
          - "KSU,SUSFS,DS,NET"
          - "KSU,BBG,DS,NET"
          - "FULL"

      KSU_BRANCH:
        description: "KernelSU-Next branch or commit"
        required: false
        default: "dev-susfs"

      SUSFS_VERSION:
        description: "SUSFS tag/branch"
        required: false
        default: "1.4.2-gki-android13-5.15"

      ENABLE_CCACHE:
        description: "Enable ccache"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

      BUILD_JOBS:
        description: "Build jobs (0 = automatic)"
        required: true
        default: "0"


jobs:

  build:

    name: "${{ inputs.KERNEL_NAME }} - GKI 5.15"

    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # ============================================================
      # DISK
      # ============================================================

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      # ============================================================
      # CHECKOUT GKI SOURCE
      # ============================================================

      - name: Checkout GKI Kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.KERNEL_SOURCE }}
          ref: ${{ inputs.KERNEL_BRANCH }}
          path: kernel_workspace
          fetch-depth: 1

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            build-essential \
            zip \
            unzip \
            curl \
            wget \
            git \
            ccache \
            python3 \
            python3-pip \
            rsync \
            dwarves \
            lz4 \
            zstd \
            xz-utils \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            clang \
            llvm \
            lld

      # ============================================================
      # SWAP
      # ============================================================

      - name: Setup Swap
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-size-gb: 16

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        if: inputs.ENABLE_CCACHE == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gki-ccache-5.15-${{ hashFiles('kernel_workspace/**/Makefile') }}
          restore-keys: |
            gki-ccache-5.15-

      - name: Configure ccache
        if: inputs.ENABLE_CCACHE == 'true'
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.ccache"

          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=10G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6

          ccache -z

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          ccache -p

      # ============================================================
      # VERIFY GKI
      # ============================================================

      - name: Verify GKI Source
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GKI SOURCE CHECK"
          echo "=========================================="

          if [ ! -d "common" ]; then
            echo "ERROR: common/ directory not found."
            echo
            echo "This workflow requires an Android GKI source tree."
            echo "The repository must contain:"
            echo
            echo "  common/"
            echo "  common/drivers/"
            echo "  common/arch/arm64/"
            echo
            exit 1
          fi

          if [ ! -d "common/drivers" ]; then
            echo "ERROR: common/drivers missing."
            exit 1
          fi

          if [ ! -d "common/arch/arm64/configs" ]; then
            echo "ERROR: GKI ARM64 configs missing."
            exit 1
          fi

          if [ ! -f \
            "common/arch/arm64/configs/${{ inputs.DEFCONFIG_NAME }}" ]; then

            echo "ERROR: Defconfig not found:"
            echo "common/arch/arm64/configs/${{ inputs.DEFCONFIG_NAME }}"

            echo
            echo "Available GKI configs:"
            find common/arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              | sort \
              | head -50

            exit 1
          fi

          echo "GKI source verified."

          echo "KERNEL_ROOT=$PWD/common" >> "$GITHUB_ENV"

      # ============================================================
      # KERNELSU-NEXT
      # ============================================================

      - name: Setup KernelSU-Next
        if: contains(inputs.FEATURE_SET, 'KSU') || inputs.FEATURE_SET == 'FULL'
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "KernelSU-Next"
          echo "=========================================="

          KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"

          KSU_BRANCH="${{ inputs.KSU_BRANCH }}"

          if [ -z "$KSU_BRANCH" ]; then
            KSU_BRANCH="dev-susfs"
          fi

          echo "Repository: $KSU_REPO"
          echo "Branch: $KSU_BRANCH"

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" \
            | bash -s dev-susfs

          if [ -d "KernelSU-Next/kernel" ]; then

            cd KernelSU-Next/kernel

            if git ls-remote \
              --heads "$KSU_REPO" "$KSU_BRANCH" \
              | grep -q .; then

              git fetch \
                --depth=50 \
                origin \
                "$KSU_BRANCH"

              git checkout \
                "origin/$KSU_BRANCH"

            else

              echo "Requested KSU branch not found."
              echo "Using dev-susfs."

            fi

            cd ../..

          fi

          echo "KernelSU-Next setup complete."

      # ============================================================
      # SUSFS
      # ============================================================

      - name: Setup SUSFS
        if: inputs.FEATURE_SET == 'SUSFS' || contains(inputs.FEATURE_SET, 'SUSFS') || inputs.FEATURE_SET == 'FULL'
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SUSFS"
          echo "=========================================="

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch "${{ inputs.SUSFS_VERSION }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          echo "SUSFS cloned."

          echo
          echo "SUSFS files:"
          find susfs/kernel_patches \
            -maxdepth 2 \
            -type f \
            | sort

          # --------------------------------------------------------
          # Main 5.15 kernel patch
          # --------------------------------------------------------

          SUSFS_KERNEL_PATCH="$(
            find susfs/kernel_patches \
              -maxdepth 1 \
              -type f \
              -name "50_add_susfs_in_kernel-5.15*.patch" \
              | head -n 1
          )"

          if [ -z "$SUSFS_KERNEL_PATCH" ]; then
            echo "ERROR: No SUSFS 5.15 kernel patch found."

            echo
            echo "Available patches:"
            find susfs/kernel_patches \
              -maxdepth 1 \
              -type f \
              -name "*.patch" \
              | sort

            exit 1
          fi

          echo "Kernel patch:"
          echo "$SUSFS_KERNEL_PATCH"

          # --------------------------------------------------------
          # KernelSU patch
          # --------------------------------------------------------

          KSU_PATCH="susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ ! -f "$KSU_PATCH" ]; then
            echo "ERROR: KernelSU SUSFS patch missing:"
            echo "$KSU_PATCH"
            exit 1
          fi

          # --------------------------------------------------------
          # Copy SUSFS source
          # --------------------------------------------------------

          cp \
            susfs/kernel_patches/fs/susfs.c \
            common/fs/

          cp \
            susfs/kernel_patches/include/linux/susfs.h \
            common/include/linux/

          # --------------------------------------------------------
          # Main kernel patch
          # --------------------------------------------------------

          cd common

          patch \
            -p1 \
            < "../$SUSFS_KERNEL_PATCH"

          cd ..

          # --------------------------------------------------------
          # KernelSU integration
          # --------------------------------------------------------

          if [ -d "KernelSU-Next/kernel" ]; then

            cd KernelSU-Next/kernel

            patch \
              -p1 \
              < "../../$KSU_PATCH" \
              || {

                echo
                echo "WARNING: KernelSU SUSFS patch did not apply."
                echo "The current KernelSU tree may already contain"
                echo "the required integration."

              }

            cd ../..

          fi

          echo "SUSFS integration complete."

      # ============================================================
      # BBG
      # ============================================================

      - name: Setup Baseband Guard
        if: contains(inputs.FEATURE_SET, 'BBG') || inputs.FEATURE_SET == 'FULL'
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Baseband Guard"
          echo "=========================================="

          rm -rf baseband-guard

          git clone \
            --depth=1 \
            https://github.com/WildKernels/baseband-guard.git \
            baseband-guard

          cd baseband-guard

          if [ -f setup.sh ]; then
            chmod +x setup.sh
            ./setup.sh
          else
            echo "ERROR: BBG setup.sh not found."
            exit 1
          fi

          cd ..

          echo "BBG setup complete."

      # ============================================================
      # DROIDSPACES
      # ============================================================

      - name: Setup DroidSpaces
        if: contains(inputs.FEATURE_SET, 'DS') || inputs.FEATURE_SET == 'FULL'
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DroidSpaces"
          echo "=========================================="

          rm -rf Droidspaces-OSS

          git clone \
            --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            Droidspaces-OSS

          echo "DroidSpaces source cloned."

          find Droidspaces-OSS \
            -maxdepth 4 \
            -type f \
            | head -100

      # ============================================================
      # NETWORKING
      # ============================================================

      - name: Configure Networking
        if: contains(inputs.FEATURE_SET, 'NET') || inputs.FEATURE_SET == 'FULL'
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -e

          cat > networking.fragment <<'EOF'
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_IPV6=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_IP_SET=y
          CONFIG_WIREGUARD=y
          EOF

          echo "Networking fragment created."

      # ============================================================
      # GKI CONFIGURATION
      # ============================================================

      - name: Configure GKI
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/out"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          echo "=========================================="
          echo "GKI CONFIGURATION"
          echo "=========================================="

          make \
            O="$OUT" \
            ARCH=arm64 \
            "${{ inputs.DEFCONFIG_NAME }}"

          # --------------------------------------------------------
          # Kernel name
          # --------------------------------------------------------

          scripts/config \
            --file "$OUT/.config" \
            --set-str LOCALVERSION \
            "-${{ inputs.KERNEL_NAME }}"

          # --------------------------------------------------------
          # KernelSU
          # --------------------------------------------------------

          if [[ "${{ inputs.FEATURE_SET }}" == *"KSU"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            scripts/config \
              --file "$OUT/.config" \
              --enable CONFIG_KSU

          fi

          # --------------------------------------------------------
          # SUSFS
          # --------------------------------------------------------

          if [[ "${{ inputs.FEATURE_SET }}" == *"SUSFS"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            echo "Enabling SUSFS."

            scripts/config \
              --file "$OUT/.config" \
              --enable CONFIG_KSU_SUSFS

            for CONFIG in \
              CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
              CONFIG_KSU_SUSFS_SUS_PATH \
              CONFIG_KSU_SUSFS_SUS_MOUNT \
              CONFIG_KSU_SUSFS_SUS_KSTAT \
              CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUD \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              CONFIG_KSU_SUSFS_TRY_UMOUNT \
              CONFIG_KSU_SUSFS_SPOOF_UNAME_RELEASE \
              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            do

              if grep -Rqs \
                "config ${CONFIG#CONFIG_}" \
                "$GITHUB_WORKSPACE/kernel_workspace" \
                --include='Kconfig*' \
                --include='*.Kconfig' \
                2>/dev/null; then

                scripts/config \
                  --file "$OUT/.config" \
                  --enable "$CONFIG"

                echo "Enabled $CONFIG"

              else

                echo "Unavailable: $CONFIG"

              fi

            done

          else

            echo "SUSFS disabled."

          fi

          # --------------------------------------------------------
          # Networking
          # --------------------------------------------------------

          if [[ "${{ inputs.FEATURE_SET }}" == *"NET"* ]] || \
             [ "${{ inputs.FEATURE_SET }}" = "FULL" ]; then

            if [ -f networking.fragment ]; then

              while IFS='=' read -r KEY VALUE; do

                case "$VALUE" in
                  y)
                    scripts/config \
                      --file "$OUT/.config" \
                      --enable "$KEY"
                    ;;
                  m)
                    scripts/config \
                      --file "$OUT/.config" \
                      --module "$KEY"
                    ;;
                esac

              done < networking.fragment

            fi

          fi

          # --------------------------------------------------------
          # Finalize
          # --------------------------------------------------------

          make \
            O="$OUT" \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep \
            -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_SUSFS' \
            "$OUT/.config" \
            || true

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build GKI Kernel
        working-directory: kernel_workspace
        shell: bash
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          set -euo pipefail

          if [ "${{ inputs.BUILD_JOBS }}" = "0" ]; then
            JOBS="$(nproc)"
          else
            JOBS="${{ inputs.BUILD_JOBS }}"
          fi

          if [ "${{ inputs.ENABLE_CCACHE }}" = "true" ]; then
            export PATH="/usr/lib/ccache:$PATH"
            CC="ccache clang"
          else
            CC="clang"
          fi

          echo "Build jobs: $JOBS"
          echo "Compiler: $CC"

          cd common

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="$CC" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$JOBS" \
            Image \
            Image.gz \
            dtbs

      # ============================================================
      # CCACHE STATS
      # ============================================================

      - name: ccache Statistics
        if: always()
        run: |
          ccache -s || true

      # ============================================================
      # KERNEL VERSION
      # ============================================================

      - name: Show Kernel Version
        if: always()
        shell: bash
        run: |
          echo "Kernel configuration:"
          grep \
            '^CONFIG_LOCALVERSION=' \
            out/.config \
            || true

          if [ -f out/arch/arm64/boot/Image ]; then
            echo
            echo "Kernel version:"
            strings \
              out/arch/arm64/boot/Image \
              | grep -m1 '^Linux version ' \
              || true
          fi

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package GKI
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -e

          rm -rf output

          mkdir -p output

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            output/

          if [ -f \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz" ]; then

            cp \
              "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz" \
              output/

          fi

          if [ -d \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/dts" ]; then

            mkdir -p output/dts

            find \
              "$GITHUB_WORKSPACE/out/arch/arm64/boot/dts" \
              -type f \
              \( -name '*.dtb' -o -name '*.dtbo' \) \
              -exec cp {} output/dts/ \; \
              || true

          fi

          cp \
            "$GITHUB_WORKSPACE/out/.config" \
            output/kernel-config

          cat > output/build-info.txt <<EOF
          Kernel: ${{ inputs.KERNEL_NAME }}
          Type: Android GKI
          Kernel Source: ${{ inputs.KERNEL_SOURCE }}
          Branch: ${{ inputs.KERNEL_BRANCH }}
          Defconfig: ${{ inputs.DEFCONFIG_NAME }}
          Feature Set: ${{ inputs.FEATURE_SET }}
          KernelSU Branch: ${{ inputs.KSU_BRANCH }}
          SUSFS Version: ${{ inputs.SUSFS_VERSION }}
          ccache: ${{ inputs.ENABLE_CCACHE }}
          Build Date: $(date -u)
          EOF

          cd output

          zip \
            -r \
            "../${{ inputs.KERNEL_NAME }}-GKI-5.15.zip" \
            .

      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload GKI Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-GKI-5.15
          path: kernel_workspace/${{ inputs.KERNEL_NAME }}-GKI-5.15.zip
          if-no-files-found: error
          compression-level: 9

      - name: Upload GKI Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: error

      - name: Upload GKI Config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.KERNEL_NAME }}-config
          path: out/.config
          if-no-files-found: error
